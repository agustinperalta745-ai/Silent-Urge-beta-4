name: Publish El Mister v0.7.12

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0712-publish.yml'
      - 'el-mister/release/v0712/**'
      - 'el-mister/release/v0712-signed/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0
      - name: Assemble source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0712
          mkdir -p /tmp/v0712/work/assets /tmp/v0712/signature/META-INF
          node --check el-mister/release/v0712/match-visual.js
          cp el-mister/source/v0711-index.html /tmp/v0712/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0712/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.7.11';" not in s or 'const VERSION_CODE=32;' not in s:
              raise SystemExit('v0.7.11 markers not found')
          s=s.replace("const VERSION='0.7.11';", "const VERSION='0.7.12';", 1)
          s=s.replace('const VERSION_CODE=32;', 'const VERSION_CODE=33;', 1)
          patch=Path('el-mister/release/v0712/match-visual.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+patch+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0712/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0712/full.js
          grep -q "const VERSION='0.7.12'" /tmp/v0712/index.html
          grep -q 'SIMULACIÓN VISUAL' /tmp/v0712/index.html
          grep -q 'v0712Advance' /tmp/v0712/index.html
          grep -q 'La cancha se detuvo en esta situación' /tmp/v0712/index.html
          grep -q 'v0711EnsureRosterIdentity' /tmp/v0712/index.html
          grep -q 'start79' /tmp/v0712/index.html
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0712/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0712/work/classes.dex
          cp /tmp/v0712/index.html /tmp/v0712/work/assets/index.html
          cd /tmp/v0712/work
          zip -q -r /tmp/v0712/El-Mister-v0.7.12.apk .
          unzip -t /tmp/v0712/El-Mister-v0.7.12.apk >/dev/null
      - name: Attach verified signature
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/release/v0712-signed/MANIFEST.MF.b64 > /tmp/v0712/signature/META-INF/MANIFEST.MF
          base64 -d el-mister/release/v0712-signed/ELMISTER.SF.b64 > /tmp/v0712/signature/META-INF/ELMISTER.SF
          base64 -d el-mister/release/v0712-signed/ELMISTER.RSA.b64 > /tmp/v0712/signature/META-INF/ELMISTER.RSA
          echo '34c0f6f6ba7bf99ec98cbcb5255c1feb19f3f1dfbf86773be1f3ce130ce99aa8  /tmp/v0712/signature/META-INF/MANIFEST.MF' | sha256sum -c -
          echo '2c9ef40a7760ea2cebcabde38931fe50d96fed6f5801efd1d1d71a06edd93959  /tmp/v0712/signature/META-INF/ELMISTER.SF' | sha256sum -c -
          echo '84e4cea3e1cc9c23f3d0c4fc1cbb208a9ee0c01b2673716be8c1125bee8ce944  /tmp/v0712/signature/META-INF/ELMISTER.RSA' | sha256sum -c -
          cd /tmp/v0712/signature
          zip -q -g -r /tmp/v0712/El-Mister-v0.7.12.apk META-INF
          unzip -t /tmp/v0712/El-Mister-v0.7.12.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0712/El-Mister-v0.7.12.apk | tee /tmp/v0712/jarverify.txt
          grep -q 'jar verified' /tmp/v0712/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0712/expected.fp
          keytool -printcert -jarfile /tmp/v0712/El-Mister-v0.7.12.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0712/actual.fp
          diff -u /tmp/v0712/expected.fp /tmp/v0712/actual.fp
          unzip -p /tmp/v0712/El-Mister-v0.7.12.apk assets/index.html | grep -q "const VERSION='0.7.12'"
          unzip -p /tmp/v0712/El-Mister-v0.7.12.apk assets/index.html | grep -q 'SIMULACIÓN VISUAL'
          unzip -p /tmp/v0712/El-Mister-v0.7.12.apk assets/index.html | grep -q 'v0711EnsureRosterIdentity'
      - name: Publish update feed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v0712/El-Mister-v0.7.12.apk el-mister/El-Mister-v0.7.12.apk
          cp /tmp/v0712/index.html el-mister/source/v0712-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.7.12.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 33,
            "versionName": "0.7.12",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.7.12.apk",
            "mandatory": false,
            "changes": [
              "Nueva simulación visual: cancha desde arriba con ambos equipos y pelota en movimiento",
              "Eliminada la pantalla estática de Simulando: el partido avanza automáticamente y se frena cuando el DT debe intervenir",
              "Las decisiones aparecen sobre la jugada con la cancha congelada en la situación correspondiente",
              "Las jugadas conectadas reflejan zonas de ataque, contras, presión, laterales altos y llegadas al área en la cancha",
              "Las decisiones tácticas modifican la forma visible del equipo durante la simulación",
              "Se mantienen minijuegos, cambios, tarjetas, cansancio, identidad de jugadores y el mercado corregido"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.7.12.apk el-mister/latest.json el-mister/source/v0712-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.7.12 animated match simulation'
          git push origin HEAD:el-mister-updates
