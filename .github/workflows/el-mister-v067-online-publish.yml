name: Publish El Mister v0.6.7 Online

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/release/v067/**'
      - '.github/workflows/el-mister-v067-online-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Build v0.6.7 Online APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elmister067
          mkdir -p /tmp/elmister067/work /tmp/elmister067/out /tmp/elmister067/signature/META-INF
          unzip -q el-mister/El-Mister-v0.6.6.apk -d /tmp/elmister067/work
          rm -rf /tmp/elmister067/work/META-INF
          cp el-mister/source/v067/index.html /tmp/elmister067/work/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/elmister067/work/AndroidManifest.xml')
          b=bytearray(p.read_bytes())
          old=int.from_bytes(b[840:844],'little')
          assert old==17, old
          b[840:844]=(18).to_bytes(4,'little')
          assert b.count(b'0.6.6\x00')==1
          b=b.replace(b'0.6.6\x00',b'0.6.7\x00',1)
          p.write_bytes(b)
          PY
          (cd /tmp/elmister067/work && zip -q -r /tmp/elmister067/out/El-Mister-v0.6.7.apk .)
          unzip -t /tmp/elmister067/out/El-Mister-v0.6.7.apk
          unzip -p /tmp/elmister067/out/El-Mister-v0.6.7.apk assets/index.html | grep -q "const VERSION='0.6.7'"
          unzip -p /tmp/elmister067/out/El-Mister-v0.6.7.apk assets/index.html | grep -q 'const VERSION_CODE=18'
          unzip -p /tmp/elmister067/out/El-Mister-v0.6.7.apk assets/index.html | grep -q "V067_ONLINE_API='https://el-mister-online.agustinperalta745.workers.dev'"

      - name: Attach precomputed public release signature
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/release/v067/MANIFEST.MF.b64 > /tmp/elmister067/signature/META-INF/MANIFEST.MF
          base64 -d el-mister/release/v067/ELMISTER.SF.b64 > /tmp/elmister067/signature/META-INF/ELMISTER.SF
          base64 -d el-mister/release/v067/ELMISTER.RSA.b64 > /tmp/elmister067/signature/META-INF/ELMISTER.RSA
          (cd /tmp/elmister067/signature && zip -q -g -r /tmp/elmister067/out/El-Mister-v0.6.7.apk META-INF)
          jarsigner -verify /tmp/elmister067/out/El-Mister-v0.6.7.apk 2>&1 | tee /tmp/jarverify.txt
          grep -q 'jar verified' /tmp/jarverify.txt
          keytool -printcert -file el-mister/release-cert.pem | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/expected.fp
          keytool -printcert -jarfile /tmp/elmister067/out/El-Mister-v0.6.7.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/actual.fp
          test -s /tmp/expected.fp && test -s /tmp/actual.fp
          diff -u /tmp/expected.fp /tmp/actual.fp
          sha256sum /tmp/elmister067/out/El-Mister-v0.6.7.apk | tee /tmp/v067.sha

      - name: Publish APK and updater feed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/elmister067/out/El-Mister-v0.6.7.apk el-mister/El-Mister-v0.6.7.apk
          SHA=$(cut -d' ' -f1 /tmp/v067.sha)
          cat > el-mister/latest.json <<JSON
          {
            "versionCode": 18,
            "versionName": "0.6.7",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.6.7.apk",
            "mandatory": false,
            "changes": [
              "Se agregó 🌐 Online directamente dentro de El Míster",
              "Penales Online 1v1 entre dos teléfonos con código de sala",
              "Las elecciones de pateador y arquero permanecen ocultas hasta resolver el penal",
              "La dirección seleccionada ya no se desmarca por actualizaciones del rival"
            ],
            "sha256": "$SHA",
            "migration": true
          }
          JSON
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.6.7.apk el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish signed El Mister v0.6.7 Online update'
          git push origin HEAD:el-mister-updates
