name: Publish El Mister v0.4.1

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v041.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
      - name: Reassemble signed APK
        shell: bash
        run: |
          cat el-mister/build/v041/*.b64 | base64 -d > el-mister/El-Mister-v0.4.1.apk
          echo '2f75b930756b0c3a9a1de55c8dca6ddc99e1aaeca9705908c441d83e6669e479  el-mister/El-Mister-v0.4.1.apk' | sha256sum -c -
          unzip -t el-mister/El-Mister-v0.4.1.apk
      - name: Commit APK
        shell: bash
        run: |
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.4.1.apk
          git commit -m 'Publish valid El Mister v0.4.1 APK'
          git push origin HEAD:el-mister-updates
