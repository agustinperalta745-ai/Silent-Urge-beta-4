name: Prepare El Mister v0.8.13 updater destination fix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0813-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Build v0.8.13 payload without changing game logic
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0813 && mkdir -p /tmp/v0813/work/assets /tmp/v0813/out el-mister/release/v0813-prep

          python3 - <<'PY'
          from pathlib import Path
          p=Path('el-mister/source/v0812-index.html')
          s=p.read_text(encoding='utf-8')
          assert "const VERSION='0.8.12';" in s
          assert 'const VERSION_CODE=48;' in s
          s=s.replace("const VERSION='0.8.12';","const VERSION='0.8.13';",1)
          s=s.replace('const VERSION_CODE=48;','const VERSION_CODE=49;',1)
          # No gameplay/visual code is changed here.
          Path('/tmp/v0813/index.html').write_text(s,encoding='utf-8')
          Path('/tmp/v0813/full.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/v0813/full.js
          node el-mister/release/v0809/test-animation-truth.js
          grep -q 'window.em809AnimationTruth' /tmp/v0813/index.html
          grep -q 'window.em811LegacyDynamicsBridge' /tmp/v0813/index.html

          base64 -d el-mister/source/v0812-AndroidManifest.xml.b64 > /tmp/v0813/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/v0813/AndroidManifest.xml')
          b=bytearray(p.read_bytes()); pos=8; strings=[]; changed=False
          while pos < len(b):
              typ,hs,sz=struct.unpack_from('<HHI',b,pos)
              if typ==0x0001:
                  sc,sty,flags,ss,sts=struct.unpack_from('<IIIII',b,pos+8); utf8=bool(flags&0x100); offs=[struct.unpack_from('<I',b,pos+hs+4*i)[0] for i in range(sc)]; base=pos+ss
                  def r8(q):
                      x=b[q]; q+=1
                      if x&0x80:return ((x&0x7f)<<8)|b[q],q+1
                      return x,q
                  for o in offs:
                      q=base+o
                      if utf8:
                          _,q=r8(q); ln,q=r8(q); strings.append(bytes(b[q:q+ln]).decode('utf-8'))
                      else:
                          ln=struct.unpack_from('<H',b,q)[0]; q+=2; strings.append(bytes(b[q:q+ln*2]).decode('utf-16le'))
              elif typ==0x0102 and strings:
                  ns,name=struct.unpack_from('<II',b,pos+16); attrStart,attrSize,attrCount=struct.unpack_from('<HHH',b,pos+24)
                  if strings[name]=='manifest':
                      ap=pos+16+attrStart
                      for i in range(attrCount):
                          ans,aname,raw=struct.unpack_from('<III',b,ap)
                          if strings[aname]=='versionCode': struct.pack_into('<I',b,ap+16,49); changed=True
                          ap+=attrSize
              pos+=sz
          assert changed
          p.write_bytes(b)
          PY

          # Patch only the updater destination filename. Same byte length, then repair DEX signature/checksum.
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0813/classes.dex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zlib,struct
          p=Path('/tmp/v0813/classes.dex'); b=bytearray(p.read_bytes())
          old=b'El-Mister-update.apk'; new=b'El-Mister-upd813.apk'
          assert len(old)==len(new)==20
          assert b.count(old)==1, b.count(old)
          b=b.replace(old,new,1)
          b[12:32]=hashlib.sha1(b[32:]).digest()
          struct.pack_into('<I',b,8,zlib.adler32(b[12:]) & 0xffffffff)
          p.write_bytes(b)
          assert new in b and old not in b
          print('Updater destination patched:',new.decode())
          PY

          cp /tmp/v0813/AndroidManifest.xml /tmp/v0813/work/AndroidManifest.xml
          cp /tmp/v0813/classes.dex /tmp/v0813/work/classes.dex
          cp /tmp/v0813/index.html /tmp/v0813/work/assets/index.html
          (cd /tmp/v0813/work && zip -q -r /tmp/v0813/out/unsigned.apk .)
          unzip -t /tmp/v0813/out/unsigned.apk >/dev/null

      - name: Produce byte exact signing metadata
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -alias dummy -keyalg RSA -keysize 3072 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -dname 'CN=Dummy' -validity 1 >/dev/null 2>&1
          jarsigner -digestalg SHA-384 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -signedjar /tmp/v0813/out/dummy.apk /tmp/v0813/out/unsigned.apk dummy >/dev/null 2>&1
          unzip -p /tmp/v0813/out/dummy.apk META-INF/MANIFEST.MF | base64 -w0 > el-mister/release/v0813-prep/MANIFEST.MF.b64
          unzip -p /tmp/v0813/out/dummy.apk META-INF/DUMMY.SF | base64 -w0 > el-mister/release/v0813-prep/ELMISTER.SF.b64
          base64 -w0 /tmp/v0813/AndroidManifest.xml > el-mister/source/v0813-AndroidManifest.xml.b64
          base64 -w0 /tmp/v0813/classes.dex > el-mister/source/v0813-classes.dex.b64
          cp /tmp/v0813/index.html el-mister/source/v0813-index.html

      - name: Commit prepared source and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/release/v0813-prep el-mister/source/v0813-index.html el-mister/source/v0813-AndroidManifest.xml.b64 el-mister/source/v0813-classes.dex.b64
          git diff --cached --quiet || git commit -m 'Prepare El Mister v0.8.13 updater destination fix'
          git push origin HEAD:el-mister-updates
