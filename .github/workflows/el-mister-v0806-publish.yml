name: Publish El Mister v0.8.6 zone-driven match logic

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0806-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Regression tests — zones and restarts
        run: |
          set -euo pipefail
          node --check el-mister/release/v0806/zone-logic.js
          node el-mister/release/v0806/test-zone-logic.js

      - name: Assemble v0.8.6 from published v0.8.5
        run: |
          set -euo pipefail
          rm -rf /tmp/v0806
          mkdir -p /tmp/v0806/work/assets /tmp/v0806/signature/META-INF
          cp el-mister/source/v0805-index.html /tmp/v0806/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0806/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.8.5';" not in s or 'const VERSION_CODE=41;' not in s:
              raise SystemExit('v0.8.5 markers not found')
          s=s.replace("const VERSION='0.8.5';", "const VERSION='0.8.6';", 1)
          s=s.replace('const VERSION_CODE=41;', 'const VERSION_CODE=42;', 1)
          patch=Path('el-mister/release/v0806/zone-logic.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+patch+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0806/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0806/full.js
          grep -q "const VERSION='0.8.6'" /tmp/v0806/index.html
          grep -q 'em806ZoneContext' /tmp/v0806/index.html
          grep -q 'em806BuildScenario' /tmp/v0806/index.html
          grep -q "type==='throwIn'" /tmp/v0806/index.html
          grep -q "type==='corner'" /tmp/v0806/index.html
          grep -q 'em805QueueGoal' /tmp/v0806/index.html
          grep -q 'em805BarParams' /tmp/v0806/index.html
          grep -q 'MOTOR 2D' /tmp/v0806/index.html

      - name: Rebuild and verify signed APK
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0806/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0806/work/classes.dex
          cp /tmp/v0806/index.html /tmp/v0806/work/assets/index.html
          cd /tmp/v0806/work
          zip -q -r /tmp/v0806/El-Mister-v0.8.6.apk .
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0806-signed/MANIFEST.MF.b64" > /tmp/v0806/signature/META-INF/MANIFEST.MF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0806-signed/ELMISTER.SF.b64" > /tmp/v0806/signature/META-INF/ELMISTER.SF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0806-signed/ELMISTER.RSA.b64" > /tmp/v0806/signature/META-INF/ELMISTER.RSA
          cd /tmp/v0806/signature
          zip -q -g -r /tmp/v0806/El-Mister-v0.8.6.apk META-INF
          unzip -t /tmp/v0806/El-Mister-v0.8.6.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0806/El-Mister-v0.8.6.apk | tee /tmp/v0806/jarverify.txt
          grep -q 'jar verified' /tmp/v0806/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0806/expected.fp
          keytool -printcert -jarfile /tmp/v0806/El-Mister-v0.8.6.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0806/actual.fp
          diff -u /tmp/v0806/expected.fp /tmp/v0806/actual.fp
          unzip -p /tmp/v0806/El-Mister-v0.8.6.apk assets/index.html | grep -q "const VERSION='0.8.6'"
          unzip -p /tmp/v0806/El-Mister-v0.8.6.apk assets/index.html | grep -q 'em806ZoneContext'
          unzip -p /tmp/v0806/El-Mister-v0.8.6.apk assets/index.html | grep -q 'em805QueueGoal'

      - name: Publish updater release
        run: |
          set -euo pipefail
          cp /tmp/v0806/El-Mister-v0.8.6.apk el-mister/El-Mister-v0.8.6.apk
          cp /tmp/v0806/index.html el-mister/source/v0806-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.8.6.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 42,
            "versionName": "0.8.6",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.8.6.apk",
            "mandatory": false,
            "changes": [
              "La ubicación y la posesión reales de la pelota en la cancha 2D definen qué decisiones pueden aparecer",
              "En tu tercio defensivo aparecen decisiones de salida, defensa y arquero; en mitad de cancha aparecen decisiones de progresión, presión y circulación; cerca del área rival aparecen remates, centros, uno contra uno y búsqueda de faltas",
              "Se elimina el acomodo artificial de la cancha para justificar una situación: la situación nace de la jugada que ya se estaba viendo",
              "Las cadenas de decisiones hacen avanzar o retroceder la pelota como consecuencia de lo que elegiste, manteniendo sincronizadas decisión y animación",
              "Gol significa saque del medio; pelota por banda significa lateral; pelota por línea de fondo significa saque de arco o córner según el último toque",
              "Los córners nacidos de una salida real por línea de fondo pueden abrir su decisión de pelota parada",
              "Se conservan la animación 2D, la coordinación de goles de 0.8.5 y la dificultad adaptativa de los minijuegos"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.8.6.apk el-mister/latest.json el-mister/source/v0806-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.8.6 zone-driven match logic'
          git push origin HEAD:el-mister-updates
