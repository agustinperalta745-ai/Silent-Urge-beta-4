name: Run El Mister v0.8.18 Match2D movement fix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0818-fix-shape-motion-run.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0
      - name: Apply correction
        run: python3 el-mister/release/v0818/fix-shape-motion.py
      - name: Validate Match2D separation
        run: |
          node --check el-mister/match2d/match2d-v0818.js
          node el-mister/release/v0818/test-match2d-separation.js el-mister/match2d/match2d-v0818.js
      - name: Commit corrected Match2D
        run: |
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/match2d/match2d-v0818.js .github/workflows/el-mister-v0818-prepare.yml
          git diff --cached --quiet || git commit -m 'Make Match2D formations exact and movement individual'
          git push origin HEAD:el-mister-updates
