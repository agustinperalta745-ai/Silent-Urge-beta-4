name: Build El Mister v0.4.3 unsigned

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/patch-v043.py'
      - 'el-mister/v043-trigger.txt'
      - '.github/workflows/el-mister-v043-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
      - name: Reconstruct v0.4.2 base
        shell: bash
        run: |
          mkdir -p /tmp/elmister/base /tmp/elmister/out
          cat el-mister/build/v042/*.b64 | base64 -d > /tmp/elmister/base.apk
          echo '253b745ba5de9bfd78f3fce5620bb73b600ef4664a91554e160fdcc6b4629363  /tmp/elmister/base.apk' | sha256sum -c -
          unzip -q /tmp/elmister/base.apk -d /tmp/elmister/base
      - name: Patch tactical squad and academy UI
        shell: bash
        run: |
          python3 el-mister/patch-v043.py /tmp/elmister/base/assets/index.html /tmp/elmister/base/assets/index.html
          grep -q "const VERSION='0.4.3'" /tmp/elmister/base/assets/index.html
          grep -q "function cycleFormation" /tmp/elmister/base/assets/index.html
          grep -q "academyPanelRelease" /tmp/elmister/base/assets/index.html
      - name: Repack unsigned APK
        shell: bash
        run: |
          rm -rf /tmp/elmister/base/META-INF
          cd /tmp/elmister/base
          zip -q -r /tmp/elmister/out/El-Mister-v0.4.3-unsigned.apk .
          unzip -t /tmp/elmister/out/El-Mister-v0.4.3-unsigned.apk
          cp assets/index.html /tmp/elmister/out/index-v043.html
          sha256sum /tmp/elmister/out/El-Mister-v0.4.3-unsigned.apk > /tmp/elmister/out/unsigned-sha256.txt
      - name: Upload unsigned package and source
        uses: actions/upload-artifact@v4
        with:
          name: el-mister-v043-unsigned
          path: |
            /tmp/elmister/out/El-Mister-v0.4.3-unsigned.apk
            /tmp/elmister/out/index-v043.html
            /tmp/elmister/out/unsigned-sha256.txt
