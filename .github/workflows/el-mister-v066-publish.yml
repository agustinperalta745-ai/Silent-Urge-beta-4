name: Publish El Mister v0.6.6

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/v066-publish-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Reconstruct stable Android base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elmister066
          mkdir -p /tmp/elmister066/work /tmp/elmister066/out
          cat el-mister/build/v062/*.b64 | base64 -d > /tmp/elmister066/base.apk
          echo '5523c8d70c1de7e5907afdf68b8e22a994d144ea649bc3b314718c6dfe7d9e53  /tmp/elmister066/base.apk' | sha256sum -c -
          unzip -q /tmp/elmister066/base.apk -d /tmp/elmister066/work
          rm -rf /tmp/elmister066/work/META-INF

      - name: Build El Mister v0.6.6 source
        shell: bash
        run: |
          set -euo pipefail
          cp el-mister/source/v063/index.html /tmp/elmister066/work/assets/index.html
          cat el-mister/build/v066/patch-*.b64 | base64 -d | gzip -d > /tmp/elmister066/v066.patch
          echo '52d89f77d2f47303a9a1de71c3bf10e4be0ce036455b2c3d5dd133a25043c62b  /tmp/elmister066/v066.patch' | sha256sum -c -
          (cd /tmp/elmister066/work/assets && patch index.html < /tmp/elmister066/v066.patch)
          echo '3778707033ef00af535a7bd5b28eef60e631dde74a72a3ec946e3f2b5fb58cbb  /tmp/elmister066/work/assets/index.html' | sha256sum -c -
          grep -q "const VERSION='0.6.6'" /tmp/elmister066/work/assets/index.html
          grep -q 'const VERSION_CODE=17' /tmp/elmister066/work/assets/index.html
          grep -q 'Copa Libertador' /tmp/elmister066/work/assets/index.html
          grep -q 'Copa Regional' /tmp/elmister066/work/assets/index.html
          grep -q 'Copa Interdivisional' /tmp/elmister066/work/assets/index.html
          grep -q 'Copa Ascenso' /tmp/elmister066/work/assets/index.html
          mkdir -p el-mister/source/v066
          cp /tmp/elmister066/work/assets/index.html el-mister/source/v066/index.html

      - name: Set Android package version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/elmister066/work/AndroidManifest.xml')
          b=bytearray(p.read_bytes())
          old_code=int.from_bytes(b[840:844], 'little')
          assert old_code == 9, old_code
          b[840:844]=(17).to_bytes(4, 'little')
          assert b.count(b'0.5.0\x00') == 1
          b=b.replace(b'0.5.0\x00', b'0.6.6\x00', 1)
          p.write_bytes(b)
          assert int.from_bytes(b[840:844], 'little') == 17
          assert b'0.6.6\x00' in b
          PY

      - name: Restore verified release signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/elmister066/work/META-INF
          echo '' | base64 -d > /tmp/elmister066/work/META-INF/MANIFEST.MF
          echo '' | base64 -d > /tmp/elmister066/work/META-INF/ELMISTER.SF
          echo '' | base64 -d > /tmp/elmister066/work/META-INF/ELMISTER.RSA

      - name: Package and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/elmister066/work
          zip -q -r /tmp/elmister066/out/El-Mister-v0.6.6.apk .
          unzip -t /tmp/elmister066/out/El-Mister-v0.6.6.apk
          jarsigner -verify /tmp/elmister066/out/El-Mister-v0.6.6.apk
          cp /tmp/elmister066/out/El-Mister-v0.6.6.apk "$GITHUB_WORKSPACE/el-mister/El-Mister-v0.6.6.apk"
          sha256sum "$GITHUB_WORKSPACE/el-mister/El-Mister-v0.6.6.apk" | tee /tmp/v066.sha

      - name: Publish updater feed
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 /tmp/v066.sha)
          cat > el-mister/latest.json <<JSON
          {
            "versionCode": 17,
            "versionName": "0.6.6",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.6.6.apk",
            "mandatory": false,
            "changes": [
              "La tabla ahora marca visualmente las zonas de clasificación según cada división",
              "Primera muestra zonas de Copa Libertador y Copa Regional",
              "Cuarta muestra Ascenso directo, Promoción y Copa Ascenso desde el 3.º al 10.º",
              "La Copa Interdivisional queda habilitada solo para Primera y Segunda y comienza en 16avos",
              "Copa Libertador y Copa Regional ahora enfrentan a clubes ficticios de otras ligas"
            ],
            "sha256": "$SHA",
            "migration": true
          }
          JSON

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.6.6.apk el-mister/latest.json el-mister/source/v066/index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.6.6 competitions update'
          git push origin HEAD:el-mister-updates
