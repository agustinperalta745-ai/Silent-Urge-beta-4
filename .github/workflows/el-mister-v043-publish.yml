name: Publish El Mister v0.4.3

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/v043-publish-trigger.txt'
      - '.github/workflows/el-mister-v043-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Reassemble and verify signed v0.4.3
        shell: bash
        run: |
          cat el-mister/build/v043/*.b64 | base64 -d > el-mister/El-Mister-v0.4.3.apk
          echo '39b5252e07535d4ac9819829ea2a319a55cc8641da8a4e8df471c65307438639  el-mister/El-Mister-v0.4.3.apk' | sha256sum -c -
          unzip -t el-mister/El-Mister-v0.4.3.apk
          jarsigner -verify el-mister/El-Mister-v0.4.3.apk
          mkdir -p el-mister/source/v043
          unzip -p el-mister/El-Mister-v0.4.3.apk assets/index.html > el-mister/source/v043/index.html
          grep -q "const VERSION='0.4.3'" el-mister/source/v043/index.html
          grep -q "const VERSION_CODE=8" el-mister/source/v043/index.html
          grep -q "function cycleFormation" el-mister/source/v043/index.html
          grep -q "function swapStarter" el-mister/source/v043/index.html
          grep -q "academyPanelRelease" el-mister/source/v043/index.html

      - name: Write v0.4.3 update feed
        shell: bash
        run: |
          cat > el-mister/latest.json <<'JSON'
          {
            "versionCode": 8,
            "versionName": "0.4.3",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.4.3.apk",
            "mandatory": false,
            "changes": [
              "Plantel táctico con cancha y jugadores ubicados según la formación",
              "Cambios manuales entre titulares y suplentes desde Plantel",
              "El once elegido ahora se usa en los partidos",
              "Cantera: subir al primer equipo, liberar o ver informe desde la ficha"
            ],
            "sha256": "39b5252e07535d4ac9819829ea2a319a55cc8641da8a4e8df471c65307438639",
            "migration": false
          }
          JSON

      - name: Publish APK, editable source and updater feed
        shell: bash
        run: |
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.4.3.apk el-mister/source/v043/index.html el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.4.3 tactical squad update'
          git push origin HEAD:el-mister-updates
