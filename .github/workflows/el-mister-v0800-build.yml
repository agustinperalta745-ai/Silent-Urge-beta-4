name: Build El Mister v0.8.0 unsigned

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/release/v0800/**'
      - '.github/workflows/el-mister-v0800-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
      - name: Validate football engine runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check el-mister/release/v0800/match-engine.js
          node --check el-mister/release/v0800/match-engine-hotfix.js
          node --check el-mister/release/v0800/test-runtime.js
          node --check el-mister/release/v0800/test-hotfix.js
          node el-mister/release/v0800/test-runtime.js
          node el-mister/release/v0800/test-hotfix.js
      - name: Assemble v0.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0800
          mkdir -p /tmp/v0800/work/assets
          cp el-mister/source/v0714-index.html /tmp/v0800/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0800/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.7.14';" not in s or 'const VERSION_CODE=35;' not in s:
              raise SystemExit('v0.7.14 markers not found')
          s=s.replace("const VERSION='0.7.14';", "const VERSION='0.8.0';", 1)
          s=s.replace('const VERSION_CODE=35;', 'const VERSION_CODE=36;', 1)
          engine=Path('el-mister/release/v0800/match-engine.js').read_text(encoding='utf-8')
          hotfix=Path('el-mister/release/v0800/match-engine-hotfix.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+engine+'\n'+hotfix+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0800/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0800/full.js
          grep -q "const VERSION='0.8.0'" /tmp/v0800/index.html
          grep -q 'const EM80=' /tmp/v0800/index.html
          grep -q 'em80CarrierThink' /tmp/v0800/index.html
          grep -q 'em801RecoverLegacyDecision' /tmp/v0800/index.html
          grep -q 'em801ApplyChoice' /tmp/v0800/index.html
          grep -q 'em801Kickoff' /tmp/v0800/index.html
          grep -q 'MOTOR 2D' /tmp/v0800/index.html
          grep -q 'v0711EnsureRosterIdentity' /tmp/v0800/index.html
          grep -q 'start79' /tmp/v0800/index.html
          grep -q 'launch79mini' /tmp/v0800/index.html
          grep -q 'v067StartShotGame' /tmp/v0800/index.html
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0800/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0800/work/classes.dex
          cp /tmp/v0800/index.html /tmp/v0800/work/assets/index.html
          cd /tmp/v0800/work
          zip -q -r /tmp/v0800/El-Mister-v0.8.0-unsigned.apk .
          unzip -t /tmp/v0800/El-Mister-v0.8.0-unsigned.apk >/dev/null
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: el-mister-v0800-unsigned
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/v0800/El-Mister-v0.8.0-unsigned.apk
            /tmp/v0800/index.html
            /tmp/v0800/full.js
