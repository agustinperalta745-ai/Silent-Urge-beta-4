name: Publish El Mister v0.7.11

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0711-publish.yml'
      - 'el-mister/release/v0711/**'
      - 'el-mister/release/v0711-signed/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0
      - name: Assemble source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0711
          mkdir -p /tmp/v0711/work/assets /tmp/v0711/signature/META-INF
          node --check el-mister/release/v0711/player-identity.js
          cp el-mister/source/v0710-index.html /tmp/v0711/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0711/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.7.10';" not in s or 'const VERSION_CODE=31;' not in s:
              raise SystemExit('v0.7.10 markers not found')
          s=s.replace("const VERSION='0.7.10';", "const VERSION='0.7.11';", 1)
          s=s.replace('const VERSION_CODE=31;', 'const VERSION_CODE=32;', 1)
          patch=Path('el-mister/release/v0711/player-identity.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+patch+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0711/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0711/full.js
          grep -q "const VERSION='0.7.11'" /tmp/v0711/index.html
          grep -q 'v0711EnsureRosterIdentity' /tmp/v0711/index.html
          grep -q 'Cada juvenil tiene un código único' /tmp/v0711/index.html
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0711/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0711/work/classes.dex
          cp /tmp/v0711/index.html /tmp/v0711/work/assets/index.html
          cd /tmp/v0711/work
          zip -q -r /tmp/v0711/El-Mister-v0.7.11.apk .
          unzip -t /tmp/v0711/El-Mister-v0.7.11.apk >/dev/null
      - name: Attach verified signature
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/release/v0711-signed/MANIFEST.MF.b64 > /tmp/v0711/signature/META-INF/MANIFEST.MF
          base64 -d el-mister/release/v0711-signed/ELMISTER.SF.b64 > /tmp/v0711/signature/META-INF/ELMISTER.SF
          base64 -d el-mister/release/v0711-signed/ELMISTER.RSA.b64 > /tmp/v0711/signature/META-INF/ELMISTER.RSA
          echo '87adac807d72b04f9e0bddbdc56ac2fcefa5f58544993d2c9f66bb42eb7ec46c  /tmp/v0711/signature/META-INF/MANIFEST.MF' | sha256sum -c -
          echo '78e06f221f02692668b398ba04cb407f72f872d55d39141a31853503fbf68059  /tmp/v0711/signature/META-INF/ELMISTER.SF' | sha256sum -c -
          echo '197763a2a837bf676d9ace64484604d4a372cb2f788fc481c9753f88fb30f77b  /tmp/v0711/signature/META-INF/ELMISTER.RSA' | sha256sum -c -
          cd /tmp/v0711/signature
          zip -q -g -r /tmp/v0711/El-Mister-v0.7.11.apk META-INF
          unzip -t /tmp/v0711/El-Mister-v0.7.11.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0711/El-Mister-v0.7.11.apk | tee /tmp/v0711/jarverify.txt
          grep -q 'jar verified' /tmp/v0711/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0711/expected.fp
          keytool -printcert -jarfile /tmp/v0711/El-Mister-v0.7.11.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0711/actual.fp
          diff -u /tmp/v0711/expected.fp /tmp/v0711/actual.fp
          unzip -p /tmp/v0711/El-Mister-v0.7.11.apk assets/index.html | grep -q "const VERSION='0.7.11'"
          unzip -p /tmp/v0711/El-Mister-v0.7.11.apk assets/index.html | grep -q 'v0711EnsureRosterIdentity'
      - name: Publish update feed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v0711/El-Mister-v0.7.11.apk el-mister/El-Mister-v0.7.11.apk
          cp /tmp/v0711/index.html el-mister/source/v0711-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.7.11.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 32,
            "versionName": "0.7.11",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.7.11.apk",
            "mandatory": false,
            "changes": [
              "Identidad de jugadores: dorsales estables en el primer equipo para reconocer siempre al mismo futbolista",
              "Canteranos con código único tipo C2-03 que se conserva al subir al primer equipo",
              "Plantilla y cambios muestran edad, OVR, potencial, energía y perfil futbolístico de cada jugador",
              "Mercado de compras y ventas muestra más datos antes de negociar: posición, edad, OVR, potencial, tipo de jugador y rasgo",
              "Los recién promovidos o fichados quedan marcados como NUEVO para encontrarlos rápido"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.7.11.apk el-mister/latest.json el-mister/source/v0711-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.7.11 player identity cards'
          git push origin HEAD:el-mister-updates
