name: Publish El Mister v0.6.9 Online Hotfix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/release/v069-hotfix/**'
      - 'el-mister/v069-hotfix-trigger.txt'
      - '.github/workflows/el-mister-v069-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Build hotfix source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elmister069
          mkdir -p /tmp/elmister069/work /tmp/elmister069/out /tmp/elmister069/signature/META-INF
          unzip -q el-mister/El-Mister-v0.6.8.apk -d /tmp/elmister069/work
          rm -rf /tmp/elmister069/work/META-INF
          cat el-mister/release/v069-hotfix/hotfix.diff.gz.b64 | base64 -d | gzip -dc > /tmp/elmister069/hotfix.diff
          patch /tmp/elmister069/work/assets/index.html < /tmp/elmister069/hotfix.diff
          grep -q "const VERSION='0.6.9'" /tmp/elmister069/work/assets/index.html
          grep -q 'const VERSION_CODE=20' /tmp/elmister069/work/assets/index.html
          grep -q 'v069OnlineOverlay' /tmp/elmister069/work/assets/index.html
          ! grep -q 'window.location.href=base' /tmp/elmister069/work/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/elmister069/work/AndroidManifest.xml')
          b=bytearray(p.read_bytes())
          old=int.from_bytes(b[840:844],'little')
          assert old==19, old
          b[840:844]=(20).to_bytes(4,'little')
          assert b.count(b'0.6.8\x00')==1
          b=b.replace(b'0.6.8\x00',b'0.6.9\x00',1)
          p.write_bytes(b)
          PY
          (cd /tmp/elmister069/work && zip -q -r /tmp/elmister069/out/El-Mister-v0.6.9.apk .)

      - name: Attach signature and verify
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/release/v069-hotfix/MANIFEST.MF.b64 > /tmp/elmister069/signature/META-INF/MANIFEST.MF
          base64 -d el-mister/release/v069-hotfix/ELMISTER.SF.b64 > /tmp/elmister069/signature/META-INF/ELMISTER.SF
          base64 -d el-mister/release/v069-hotfix/ELMISTER.RSA.b64 > /tmp/elmister069/signature/META-INF/ELMISTER.RSA
          (cd /tmp/elmister069/signature && zip -q -g -r /tmp/elmister069/out/El-Mister-v0.6.9.apk META-INF)
          jarsigner -verify /tmp/elmister069/out/El-Mister-v0.6.9.apk 2>&1 | tee /tmp/jarverify.txt
          grep -q 'jar verified' /tmp/jarverify.txt
          keytool -printcert -file el-mister/release-cert.pem | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/expected.fp
          keytool -printcert -jarfile /tmp/elmister069/out/El-Mister-v0.6.9.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/actual.fp
          diff -u /tmp/expected.fp /tmp/actual.fp
          sha256sum /tmp/elmister069/out/El-Mister-v0.6.9.apk | tee /tmp/v069.sha

      - name: Publish hotfix
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/elmister069/out/El-Mister-v0.6.9.apk el-mister/El-Mister-v0.6.9.apk
          SHA=$(cut -d' ' -f1 /tmp/v069.sha)
          cat > el-mister/latest.json <<JSON
          {
            "versionCode": 20,
            "versionName": "0.6.9",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.6.9.apk",
            "mandatory": false,
            "changes": [
              "Hotfix Online: se elimina la redirección externa que cerraba/crasheaba la app",
              "Penales Online vuelve a abrirse de forma segura dentro de El Míster",
              "Amistoso DT vs DT y Ligas Online usan la ruta correcta /online.html",
              "Se agregó una vista Online embebida con botón Volver"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          JSON
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.6.9.apk el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.6.9 Online crash hotfix'
          git push origin HEAD:el-mister-updates
