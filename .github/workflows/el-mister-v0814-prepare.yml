name: Prepare El Mister v0.8.14 decision bridge fix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0814-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Build v0.8.14 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0814 && mkdir -p /tmp/v0814/work/assets /tmp/v0814/out el-mister/release/v0814-prep

          python3 - <<'PY'
          from pathlib import Path
          p=Path('el-mister/source/v0813-index.html')
          s=p.read_text(encoding='utf-8')
          assert "const VERSION='0.8.13';" in s
          assert 'const VERSION_CODE=49;' in s
          s=s.replace("const VERSION='0.8.13';","const VERSION='0.8.14';",1)
          s=s.replace('const VERSION_CODE=49;','const VERSION_CODE=50;',1)
          patch=Path('el-mister/release/v0814/decision-bridge-fix.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+patch+'\n</script>'+tail
          Path('/tmp/v0814/index.html').write_text(s,encoding='utf-8')
          Path('/tmp/v0814/full.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY

          node --check /tmp/v0814/full.js
          node el-mister/release/v0809/test-animation-truth.js
          grep -q "const VERSION='0.8.14'" /tmp/v0814/index.html
          grep -q 'const VERSION_CODE=50;' /tmp/v0814/index.html
          grep -q 'window.em809AnimationTruth' /tmp/v0814/index.html
          grep -q 'window.em811LegacyDynamicsBridge' /tmp/v0814/index.html
          grep -q 'window.em814DecisionBridge' /tmp/v0814/index.html
          # The final bridge must render the already-created historical scenario directly.
          tail -n 100 /tmp/v0814/index.html | grep -q 'renderLiveDecision=renderHistoricalDecision'
          tail -n 100 /tmp/v0814/index.html | grep -q 'em80PauseForDecision=function'

          base64 -d el-mister/source/v0813-AndroidManifest.xml.b64 > /tmp/v0814/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/v0814/AndroidManifest.xml')
          b=bytearray(p.read_bytes())
          pos=8; strings=[]; changed=False
          while pos < len(b):
              typ,hs,sz=struct.unpack_from('<HHI',b,pos)
              if typ==0x0001:
                  sc,sty,flags,ss,sts=struct.unpack_from('<IIIII',b,pos+8)
                  utf8=bool(flags&0x100)
                  offs=[struct.unpack_from('<I',b,pos+hs+4*i)[0] for i in range(sc)]
                  base=pos+ss
                  def r8(q):
                      x=b[q]; q+=1
                      if x&0x80:return ((x&0x7f)<<8)|b[q],q+1
                      return x,q
                  for o in offs:
                      q=base+o
                      if utf8:
                          _,q=r8(q); ln,q=r8(q); strings.append(bytes(b[q:q+ln]).decode('utf-8'))
                      else:
                          ln=struct.unpack_from('<H',b,q)[0]; q+=2; strings.append(bytes(b[q:q+ln*2]).decode('utf-16le'))
              elif typ==0x0102 and strings:
                  ns,name=struct.unpack_from('<II',b,pos+16); attrStart,attrSize,attrCount=struct.unpack_from('<HHH',b,pos+24)
                  if strings[name]=='manifest':
                      ap=pos+16+attrStart
                      for i in range(attrCount):
                          ans,aname,raw=struct.unpack_from('<III',b,ap)
                          if strings[aname]=='versionCode':
                              struct.pack_into('<I',b,ap+16,50); changed=True
                          ap+=attrSize
              pos+=sz
          assert changed
          p.write_bytes(b)
          PY

          # Keep updater cache-safe: 813 -> 814 is the same byte length.
          base64 -d el-mister/source/v0813-classes.dex.b64 > /tmp/v0814/classes.dex
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0814/classes.dex')
          b=p.read_bytes()
          old=b'El-Mister-upd813.apk'; new=b'El-Mister-upd814.apk'
          assert old in b and len(old)==len(new)
          b=b.replace(old,new)
          # Repair DEX SHA-1 and Adler32 checksums after same-length string patch.
          import hashlib,zlib,struct
          b=bytearray(b)
          b[12:32]=hashlib.sha1(b[32:]).digest()
          struct.pack_into('<I',b,8,zlib.adler32(b[12:]) & 0xffffffff)
          p.write_bytes(b)
          PY

          cp /tmp/v0814/AndroidManifest.xml /tmp/v0814/work/AndroidManifest.xml
          cp /tmp/v0814/classes.dex /tmp/v0814/work/classes.dex
          cp /tmp/v0814/index.html /tmp/v0814/work/assets/index.html
          (cd /tmp/v0814/work && zip -q -D /tmp/v0814/out/unsigned.apk AndroidManifest.xml assets/index.html classes.dex)
          unzip -t /tmp/v0814/out/unsigned.apk >/dev/null

      - name: Produce byte exact signing metadata
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -alias dummy -keyalg RSA -keysize 3072 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -dname 'CN=Dummy' -validity 1 >/dev/null 2>&1
          jarsigner -digestalg SHA-384 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -signedjar /tmp/v0814/out/dummy.apk /tmp/v0814/out/unsigned.apk dummy >/dev/null 2>&1
          unzip -p /tmp/v0814/out/dummy.apk META-INF/MANIFEST.MF | base64 -w0 > el-mister/release/v0814-prep/MANIFEST.MF.b64
          unzip -p /tmp/v0814/out/dummy.apk META-INF/DUMMY.SF | base64 -w0 > el-mister/release/v0814-prep/ELMISTER.SF.b64
          base64 -w0 /tmp/v0814/AndroidManifest.xml > el-mister/source/v0814-AndroidManifest.xml.b64
          base64 -w0 /tmp/v0814/classes.dex > el-mister/source/v0814-classes.dex.b64
          cp /tmp/v0814/index.html el-mister/source/v0814-index.html

      - name: Commit prepared source and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/release/v0814-prep el-mister/source/v0814-index.html el-mister/source/v0814-AndroidManifest.xml.b64 el-mister/source/v0814-classes.dex.b64
          git diff --cached --quiet || git commit -m 'Prepare El Mister v0.8.14 decision bridge metadata'
          git push origin HEAD:el-mister-updates
