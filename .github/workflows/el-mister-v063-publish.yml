name: Publish El Mister v0.6.3 fixed

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v063-publish.yml'
      - 'el-mister/v063-fixed-publish-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Reconstruct stable v0.6.2 base
        shell: bash
        run: |
          rm -rf /tmp/elmister063
          mkdir -p /tmp/elmister063/work /tmp/elmister063/out
          cat el-mister/build/v062/*.b64 | base64 -d > /tmp/elmister063/base.apk
          echo '5523c8d70c1de7e5907afdf68b8e22a994d144ea649bc3b314718c6dfe7d9e53  /tmp/elmister063/base.apk' | sha256sum -c -
          unzip -q /tmp/elmister063/base.apk -d /tmp/elmister063/work
          rm -rf /tmp/elmister063/work/META-INF

      - name: Install v0.6.3 source and Android package version
        shell: bash
        run: |
          cp el-mister/source/v063/index.html /tmp/elmister063/work/assets/index.html
          grep -q "const VERSION='0.6.3'" /tmp/elmister063/work/assets/index.html
          grep -q "const VERSION_CODE=14" /tmp/elmister063/work/assets/index.html
          grep -q "v063AdvanceUntilDecision" /tmp/elmister063/work/assets/index.html
          grep -q "🔄 Hacer cambio" /tmp/elmister063/work/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/elmister063/work/AndroidManifest.xml')
          b=bytearray(p.read_bytes())
          old_code=int.from_bytes(b[840:844], 'little')
          assert old_code == 9, old_code
          b[840:844]=(14).to_bytes(4, 'little')
          assert b.count(b'0.5.0\x00') == 1
          b=b.replace(b'0.5.0\x00', b'0.6.3\x00', 1)
          p.write_bytes(b)
          assert int.from_bytes(b[840:844], 'little') == 14
          assert b'0.6.3\x00' in b
          PY

      - name: Restore verified release signature
        shell: bash
        run: |
          mkdir -p /tmp/elmister063/work/META-INF
          base64 -d el-mister/build/v063-signatures/MANIFEST.MF.b64 > /tmp/elmister063/work/META-INF/MANIFEST.MF
          base64 -d el-mister/build/v063-signatures/ELMISTER.SF.b64 > /tmp/elmister063/work/META-INF/ELMISTER.SF
          base64 -d el-mister/build/v063-signatures/ELMISTER.RSA.b64 > /tmp/elmister063/work/META-INF/ELMISTER.RSA
          echo '6c12630aae949ee66b01e9d5a28cfd6098a1cfb55b4ff0ed27f9aac0bdacbf8e  /tmp/elmister063/work/META-INF/MANIFEST.MF' | sha256sum -c -
          echo '1617fba5dbed7377da6739ac03ff012ee8538b318bdd0e9898d0150d77272954  /tmp/elmister063/work/META-INF/ELMISTER.SF' | sha256sum -c -
          echo '4044bdefef84b53e9863a497529380a7530207099d1d51213a0e2c54361047f1  /tmp/elmister063/work/META-INF/ELMISTER.RSA' | sha256sum -c -

      - name: Build and verify installable APK
        shell: bash
        run: |
          cd /tmp/elmister063/work
          zip -q -r /tmp/elmister063/out/El-Mister-v0.6.3.apk .
          unzip -t /tmp/elmister063/out/El-Mister-v0.6.3.apk
          jarsigner -verify /tmp/elmister063/out/El-Mister-v0.6.3.apk
          cp /tmp/elmister063/out/El-Mister-v0.6.3.apk "$GITHUB_WORKSPACE/el-mister/El-Mister-v0.6.3.apk"
          sha256sum "$GITHUB_WORKSPACE/el-mister/El-Mister-v0.6.3.apk" | tee /tmp/v063.sha

      - name: Publish updater feed only after verification
        shell: bash
        run: |
          SHA=$(cut -d' ' -f1 /tmp/v063.sha)
          cat > el-mister/latest.json <<JSON
          {
            "versionCode": 14,
            "versionName": "0.6.3",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.6.3.apk",
            "mandatory": false,
            "changes": [
              "El partido ya no muestra el reloj corriendo: avanza internamente hasta la próxima decisión",
              "Las sustituciones se hacen desde 🔄 Hacer cambio dentro de la misma decisión",
              "Después de sustituir volvés a la decisión pendiente sin crear una pausa adicional",
              "El paquete Android ahora usa versionCode 14 y versión 0.6.3 reales"
            ],
            "sha256": "$SHA",
            "migration": true
          }
          JSON

      - name: Commit verified APK and feed
        shell: bash
        run: |
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.6.3.apk el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish fixed signed El Mister v0.6.3 update'
          git push origin HEAD:el-mister-updates
