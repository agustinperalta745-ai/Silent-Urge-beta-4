name: Publish El Mister v0.8.2 intervention fix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0802-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Regression test — intervention only
        shell: bash
        run: |
          set -euo pipefail
          node --check el-mister/release/v0802/intervention-bridge.js
          node el-mister/release/v0802/test-intervention-bridge.js

      - name: Assemble v0.8.2 from published v0.8.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0802
          mkdir -p /tmp/v0802/work/assets /tmp/v0802/signature/META-INF
          cp el-mister/source/v0801-index.html /tmp/v0802/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0802/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.8.1';" not in s or 'const VERSION_CODE=37;' not in s:
              raise SystemExit('v0.8.1 markers not found')
          s=s.replace("const VERSION='0.8.1';", "const VERSION='0.8.2';", 1)
          s=s.replace('const VERSION_CODE=37;', 'const VERSION_CODE=38;', 1)
          fix=Path('el-mister/release/v0802/intervention-bridge.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+fix+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0802/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0802/full.js
          grep -q "const VERSION='0.8.2'" /tmp/v0802/index.html
          grep -q 'const VERSION_CODE=38' /tmp/v0802/index.html
          grep -q 'em802DecisionVisible' /tmp/v0802/index.html
          grep -q 'em802 watchdog' /tmp/v0802/index.html
          grep -q 'MOTOR 2D' /tmp/v0802/index.html
          grep -q 'em801Kickoff' /tmp/v0802/index.html
          grep -q 'launch79mini' /tmp/v0802/index.html
          grep -q 'v067StartShotGame' /tmp/v0802/index.html

      - name: Rebuild and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0802/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0802/work/classes.dex
          cp /tmp/v0802/index.html /tmp/v0802/work/assets/index.html
          cd /tmp/v0802/work
          zip -q -r /tmp/v0802/El-Mister-v0.8.2.apk .
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0802-signed/MANIFEST.MF.b64" > /tmp/v0802/signature/META-INF/MANIFEST.MF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0802-signed/ELMISTER.SF.b64" > /tmp/v0802/signature/META-INF/ELMISTER.SF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0802-signed/ELMISTER.RSA.b64" > /tmp/v0802/signature/META-INF/ELMISTER.RSA
          cd /tmp/v0802/signature
          zip -q -g -r /tmp/v0802/El-Mister-v0.8.2.apk META-INF
          unzip -t /tmp/v0802/El-Mister-v0.8.2.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0802/El-Mister-v0.8.2.apk | tee /tmp/v0802/jarverify.txt
          grep -q 'jar verified' /tmp/v0802/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0802/expected.fp
          keytool -printcert -jarfile /tmp/v0802/El-Mister-v0.8.2.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0802/actual.fp
          diff -u /tmp/v0802/expected.fp /tmp/v0802/actual.fp
          unzip -p /tmp/v0802/El-Mister-v0.8.2.apk assets/index.html | grep -q "const VERSION='0.8.2'"
          unzip -p /tmp/v0802/El-Mister-v0.8.2.apk assets/index.html | grep -q 'em802DecisionVisible'
          unzip -p /tmp/v0802/El-Mister-v0.8.2.apk assets/index.html | grep -q 'launch79mini'

      - name: Publish updater release
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v0802/El-Mister-v0.8.2.apk el-mister/El-Mister-v0.8.2.apk
          cp /tmp/v0802/index.html el-mister/source/v0802-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.8.2.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 38,
            "versionName": "0.8.2",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.8.2.apk",
            "mandatory": false,
            "changes": [
              "Corregido el bloqueo donde la cancha se congelaba pero no aparecía la situación del DT",
              "Las situaciones contextuales y secuencias de minijuegos ahora se abren por un puente directo y estable",
              "Se agregó un seguro que vuelve a dibujar la intervención si el modal no llega a mostrarse",
              "El Motor 2D, sus movimientos, pases, posiciones y animación quedan exactamente como en v0.8.1"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.8.2.apk el-mister/latest.json el-mister/source/v0802-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.8.2 intervention bridge fix'
          git push origin HEAD:el-mister-updates
