name: El Mister Online Deploy

on:
  push:
    branches:
      - el-mister-updates
    paths:
      - 'el-mister/online/worker/**'
      - '.github/workflows/el-mister-online-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: el-mister/online/worker
          command: deploy
