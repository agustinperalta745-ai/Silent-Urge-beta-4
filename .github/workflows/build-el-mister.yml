name: Build El Mister APK

on:
  workflow_dispatch:
  push:
    branches:
      - el-mister-v0.1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: el-mister
        run: gradle assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp el-mister/app/build/outputs/apk/debug/app-debug.apk output/El-Mister-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Mister-v0.1
          path: output/El-Mister-v0.1.apk
          if-no-files-found: error
