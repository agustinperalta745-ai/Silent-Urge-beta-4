name: Build El Mister v0.7.10 unsigned

on:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/release/v0710/**'
      - '.github/workflows/el-mister-v0710-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble v0.7.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0710
          mkdir -p /tmp/v0710/work/assets
          cp el-mister/source/v079-index.html /tmp/v0710/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0710/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.7.9';" not in s or 'const VERSION_CODE=30;' not in s:
              raise SystemExit('v0.7.9 markers not found')
          s=s.replace("const VERSION='0.7.9';", "const VERSION='0.7.10';", 1)
          s=s.replace('const VERSION_CODE=30;', 'const VERSION_CODE=31;', 1)
          patch=Path('el-mister/release/v0710/fix.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+patch+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0710/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0710/full.js
          grep -q "const VERSION='0.7.10'" /tmp/v0710/index.html
          grep -q 'v0710RankedDivision' /tmp/v0710/index.html
          grep -q 'v0710EnterMarketFromSeasonEnd' /tmp/v0710/index.html
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0710/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0710/work/classes.dex
          cp /tmp/v0710/index.html /tmp/v0710/work/assets/index.html
          cd /tmp/v0710/work
          zip -q -r /tmp/v0710/El-Mister-v0.7.10-unsigned.apk .
          unzip -t /tmp/v0710/El-Mister-v0.7.10-unsigned.apk >/dev/null
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: el-mister-v0710-unsigned
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/v0710/El-Mister-v0.7.10-unsigned.apk
            /tmp/v0710/index.html
