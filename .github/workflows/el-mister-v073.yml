name: Publish El Mister v0.7.3 Safe

on:
  workflow_dispatch:
  push:
    branches: [el-mister-updates]
    paths:
      - 'el-mister/release/v073-safe/trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Rebuild real v0.7.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v073
          cp el-mister/source/v069-index.html /tmp/v073/index.html
          base64 -d el-mister/release/v072-safe/v072.diff.gz.b64 | gunzip > /tmp/v073/v072.diff
          patch /tmp/v073/index.html < /tmp/v073/v072.diff
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v073/index.html')
          s=p.read_text(encoding='utf-8')
          assert "const VERSION='0.7.2'" in s
          assert 'const VERSION_CODE=23' in s
          s=s.replace("const VERSION='0.7.2'", "const VERSION='0.7.3'", 1)
          s=s.replace('const VERSION_CODE=23', 'const VERSION_CODE=24', 1)
          p.write_text(s, encoding='utf-8')
          PY
          echo '8be659c1b4e4dbb7b804dee18adc0081d6e5652e80a04cf065521226d2e9225b  /tmp/v073/index.html' | sha256sum -c -
          grep -q "const VERSION='0.7.3'" /tmp/v073/index.html
          grep -q 'const VERSION_CODE=24' /tmp/v073/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/v073/index.html').read_text(encoding='utf-8')
          js=s[s.index('<script>')+8:s.rindex('</script>')]
          Path('/tmp/v073/app.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/v073/app.js

      - name: Assemble exact signed v0.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v073/apk
          mkdir -p /tmp/v073/apk/assets /tmp/v073/apk/META-INF
          unzip -p el-mister/El-Mister-v0.6.9.apk AndroidManifest.xml > /tmp/v073/apk/AndroidManifest.xml
          unzip -p el-mister/El-Mister-v0.6.9.apk classes.dex > /tmp/v073/apk/classes.dex
          cp /tmp/v073/index.html /tmp/v073/apk/assets/index.html
          base64 -d el-mister/release/v073-safe/MANIFEST.exact.b64 > /tmp/v073/apk/META-INF/MANIFEST.MF
          base64 -d el-mister/release/v073-safe/ELMISTER.exact.b64 > /tmp/v073/apk/META-INF/ELMISTER.SF
          base64 -d el-mister/release/v073-safe/ELMISTER.RSA.b64 > /tmp/v073/apk/META-INF/ELMISTER.RSA
          echo 'f09cf5842da7fee5f308a61a21f08ef4e11efdcebd674254ac6dd9f82653f22b  /tmp/v073/apk/META-INF/MANIFEST.MF' | sha256sum -c -
          echo '2e1b45193911a9a97bc391899518145aea40a3aa5fc903b4a9df8083fc5e7bd4  /tmp/v073/apk/META-INF/ELMISTER.SF' | sha256sum -c -
          echo 'a66593d4247af9343700eae7ca55b40a836277b73dec870c3aa45035d5e3157d  /tmp/v073/apk/META-INF/ELMISTER.RSA' | sha256sum -c -
          cd /tmp/v073/apk
          zip -q -X /tmp/v073/El-Mister-v0.7.3.apk META-INF/MANIFEST.MF META-INF/ELMISTER.SF META-INF/ELMISTER.RSA classes.dex AndroidManifest.xml assets/index.html
          unzip -t /tmp/v073/El-Mister-v0.7.3.apk
          jarsigner -verify -verbose -certs /tmp/v073/El-Mister-v0.7.3.apk | tee /tmp/v073/jarverify.txt
          grep -q 'jar verified' /tmp/v073/jarverify.txt
          unzip -p /tmp/v073/El-Mister-v0.7.3.apk assets/index.html | grep -q "const VERSION='0.7.3'"
          unzip -p /tmp/v073/El-Mister-v0.7.3.apk assets/index.html | grep -q 'const VERSION_CODE=24'
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v073/expected.fp
          keytool -printcert -jarfile /tmp/v073/El-Mister-v0.7.3.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v073/actual.fp
          test -s /tmp/v073/expected.fp && test -s /tmp/v073/actual.fp
          diff -u /tmp/v073/expected.fp /tmp/v073/actual.fp

      - name: Publish APK and updater feed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v073/El-Mister-v0.7.3.apk el-mister/El-Mister-v0.7.3.apk
          SHA=$(sha256sum el-mister/El-Mister-v0.7.3.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 24,
            "versionName": "0.7.3",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.7.3.apk",
            "mandatory": false,
            "changes": [
              "Corrección de actualización: v0.7.3 ahora instala el APK real y muestra la versión correcta",
              "Online: cada partido de liga incorpora Jugar ahora y estado de listo por DT",
              "Crear liga permite comenzar hoy o elegir una fecha de inicio",
              "El fixture respeta la fecha inicial, los días habilitados y el rango horario configurado"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.7.3.apk el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish corrected real El Mister v0.7.3 APK'
          git push origin HEAD:el-mister-updates
