name: Prepare El Mister v0.8.17 decision render safety fix

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0817-prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Build v0.8.17 with scenario-preserving fallback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v0817 && mkdir -p /tmp/v0817/work/assets /tmp/v0817/out el-mister/release/v0817-prep

          python3 - <<'PY'
          from pathlib import Path

          src=Path('el-mister/source/v0816-index.html')
          s=src.read_text(encoding='utf-8')
          assert "const VERSION='0.8.16';" in s
          assert 'const VERSION_CODE=52;' in s
          assert "goalVisual:'continuous-before-score'" in s
          assert "interventions:'historical-minimum-two'" in s

          old="""  function resumeAfterRenderFailure(l,err){
    console.error('em814 decision render',err);
    try{l.scenario=null;save()}catch(e){}
    try{if(typeof toast==='function')toast('No se pudo abrir la situación. El partido continúa.')}catch(e){}
    setTimeout(()=>{try{if(S.live&&typeof em80RenderMatch==='function')em80RenderMatch();else if(typeof v06RenderMatchHub==='function')v06RenderMatchHub()}catch(e){console.error('em814 resume',e)}},80)
  }
"""

          new="""  function resumeAfterRenderFailure(l,err){
    console.error('em817 decision render fallback',err);
    if(!l)return false;
    try{if(typeof em80Stop==='function')em80Stop()}catch(e){}

    // CRITICAL: a visual/rendering failure must NEVER consume or clear the
    // historical gameplay situation. Keep the same scenario pending and show
    // it without optional pitch/context decoration.
    const s=l.scenario;
    if(!validScenario(s)){
      console.error('em817 fallback has no valid pending scenario');
      try{
        if(typeof openModal==='function')openModal(`<div class=\"liveHead\"><div class=\"minute\">${l.minute||0}' · PARTIDO DETENIDO</div><div class=\"liveScore\">${l.gh||0} – ${l.ga||0}</div></div><h2>La situación sigue pendiente</h2><p>No se pudo preparar la tarjeta de decisión. El partido queda pausado para no saltear la jugada.</p><button class=\"primary\" onclick=\"em80PauseForDecision()\">Reintentar situación</button>`);
      }catch(e){console.error('em817 retry modal',e)}
      return false;
    }

    try{save()}catch(e){}
    const canSub=canSubNow(l);
    const cls=s.kind==='keyplay'?'keyplay':s.kind==='rare'?'rare':'';
    const label=s.kind==='rare'?'EN CANCHA':s.kind==='keyplay'?'JUGADA CLAVE':'LECTURA DEL PARTIDO';
    const pill=s.kind==='rare'?'bad':s.kind==='keyplay'?'warn':'';
    const html=`<div class=\"liveHead\"><div class=\"row between\"><span class=\"minute\">${l.minute}' · INTERVENCIÓN ${l.pauseCount||l.stopIndex+1}</span><span class=\"pill ${pill}\">${label}</span></div><div class=\"liveScore\">${l.gh} – ${l.ga}</div></div><div class=\"v0712Paused\">La jugada queda detenida hasta que tomes una decisión.</div><h2>${s.t}</h2><p>${s.d||''}</p>${s.o.map((o,i)=>`<button class=\"choice ${cls}\" onclick=\"resolveMatchChoice(${i})\"><b>${o.t}</b><span>${o.h||''}</span></button>`).join('')}<div style=\"height:8px\"></div>${canSub?'<button class=\"secondary\" onclick=\"v062OpenSubsFromDecision()\">🔄 Hacer cambio</button><div class=\"small muted center\" style=\"margin-top:9px\">La decisión sigue pendiente mientras hacés la sustitución.</div>':''}`;

    try{
      if(typeof openModal==='function'){
        openModal(html);
      }else{
        const root=document.getElementById('modalRoot');
        if(!root)throw new Error('modalRoot missing');
        root.innerHTML=`<div class=\"modalBg\"><div class=\"modal\">${html}</div></div>`;
      }
      return true;
    }catch(e){
      console.error('em817 safe decision modal failed',e);
      try{
        const root=document.getElementById('modalRoot');
        if(root){root.innerHTML=`<div class=\"modalBg\"><div class=\"modal\">${html}</div></div>`;return true}
      }catch(e2){console.error('em817 direct modal failed',e2)}
      return false;
    }
  }
"""

          assert old in s, 'expected v0.8.14 render-failure bridge not found'
          s=s.replace(old,new,1)
          s=s.replace("const VERSION='0.8.16';","const VERSION='0.8.17';",1)
          s=s.replace('const VERSION_CODE=52;','const VERSION_CODE=53;',1)

          # Regression guards: the old destructive fallback must be gone while
          # all pre-existing historical gameplay markers remain untouched.
          assert "toast('No se pudo abrir la situación. El partido continúa.')" not in s
          assert "console.error('em817 decision render fallback'" in s
          assert "goalVisual:'continuous-before-score'" in s
          assert "interventions:'historical-minimum-two'" in s
          assert 'renderLiveDecision=renderHistoricalDecision;' in s
          assert 'l.scenario=makeMatchScenario(l.stopIndex)' in s

          Path('/tmp/v0817/index.html').write_text(s,encoding='utf-8')
          Path('/tmp/v0817/full.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY

          node --check /tmp/v0817/full.js
          node el-mister/release/v0809/test-animation-truth.js

          # Native manifest: package unchanged, versionCode only 52 -> 53.
          base64 -d el-mister/source/v0816-AndroidManifest.xml.b64 > /tmp/v0817/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/v0817/AndroidManifest.xml'); b=bytearray(p.read_bytes())
          pos=8; strings=[]; changed=False; package=None
          while pos < len(b):
              typ,hs,sz=struct.unpack_from('<HHI',b,pos)
              if typ==0x0001:
                  sc,sty,flags,ss,sts=struct.unpack_from('<IIIII',b,pos+8); utf8=bool(flags&0x100); offs=[struct.unpack_from('<I',b,pos+hs+4*i)[0] for i in range(sc)]; base=pos+ss
                  def r8(q):
                      x=b[q]; q+=1
                      if x&0x80:return ((x&0x7f)<<8)|b[q],q+1
                      return x,q
                  strings=[]
                  for o in offs:
                      q=base+o
                      if utf8:
                          _,q=r8(q); ln,q=r8(q); strings.append(bytes(b[q:q+ln]).decode('utf-8'))
                      else:
                          ln=struct.unpack_from('<H',b,q)[0]; q+=2; strings.append(bytes(b[q:q+ln*2]).decode('utf-16le'))
              elif typ==0x0102 and strings:
                  ns,name=struct.unpack_from('<II',b,pos+16); attrStart,attrSize,attrCount=struct.unpack_from('<HHH',b,pos+24)
                  if strings[name]=='manifest':
                      ap=pos+16+attrStart
                      for i in range(attrCount):
                          ans,aname,raw=struct.unpack_from('<III',b,ap)
                          if strings[aname]=='versionCode': struct.pack_into('<I',b,ap+16,53); changed=True
                          if strings[aname]=='package': package=strings[raw]
                          ap+=attrSize
              pos+=sz
          assert changed and package=='com.elmister.carrera',(changed,package)
          p.write_bytes(b)
          PY

          # Wrapper: updater filename 816 -> 817; repair DEX integrity fields.
          base64 -d el-mister/source/v0816-classes.dex.b64 > /tmp/v0817/classes.dex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zlib,struct
          p=Path('/tmp/v0817/classes.dex'); b=bytearray(p.read_bytes())
          old=b'El-Mister-upd816.apk'; new=b'El-Mister-upd817.apk'
          assert len(old)==len(new) and old in b and new not in b
          b=bytearray(bytes(b).replace(old,new,1))
          b[12:32]=hashlib.sha1(b[32:]).digest()
          struct.pack_into('<I',b,8,zlib.adler32(b[12:]) & 0xffffffff)
          p.write_bytes(b)
          chk=struct.unpack_from('<I',b,8)[0]
          sig=bytes(b[12:32])
          assert sig==hashlib.sha1(b[32:]).digest(), 'DEX SHA-1 mismatch'
          assert chk==(zlib.adler32(b[12:]) & 0xffffffff), 'DEX Adler32 mismatch'
          assert new in b and old not in b
          print('DEX header integrity: OK')
          PY

          cp /tmp/v0817/AndroidManifest.xml /tmp/v0817/work/AndroidManifest.xml
          cp /tmp/v0817/classes.dex /tmp/v0817/work/classes.dex
          cp /tmp/v0817/index.html /tmp/v0817/work/assets/index.html
          (cd /tmp/v0817/work && zip -q -D /tmp/v0817/out/El-Mister-v0.8.17-unsigned.apk AndroidManifest.xml assets/index.html classes.dex)
          unzip -t /tmp/v0817/out/El-Mister-v0.8.17-unsigned.apk >/dev/null

      - name: Produce exact signing preparation metadata
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -alias dummy -keyalg RSA -keysize 3072 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -dname 'CN=Dummy' -validity 1 >/dev/null 2>&1
          jarsigner -digestalg SHA-384 -sigalg SHA384withRSA -keystore /tmp/dummy.p12 -storetype PKCS12 -storepass changeit -keypass changeit -signedjar /tmp/v0817/out/dummy.apk /tmp/v0817/out/El-Mister-v0.8.17-unsigned.apk dummy >/dev/null 2>&1
          unzip -p /tmp/v0817/out/dummy.apk META-INF/MANIFEST.MF | base64 -w0 > el-mister/release/v0817-prep/MANIFEST.MF.b64
          unzip -p /tmp/v0817/out/dummy.apk META-INF/DUMMY.SF | base64 -w0 > el-mister/release/v0817-prep/ELMISTER.SF.b64
          base64 -w0 /tmp/v0817/AndroidManifest.xml > el-mister/source/v0817-AndroidManifest.xml.b64
          base64 -w0 /tmp/v0817/classes.dex > el-mister/source/v0817-classes.dex.b64
          cp /tmp/v0817/index.html el-mister/source/v0817-index.html

      - name: Upload unsigned APK for signing
        uses: actions/upload-artifact@v4
        with:
          name: El-Mister-v0.8.17-unsigned
          path: /tmp/v0817/out/El-Mister-v0.8.17-unsigned.apk
          if-no-files-found: error

      - name: Commit prepared source and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/release/v0817-prep el-mister/source/v0817-index.html el-mister/source/v0817-AndroidManifest.xml.b64 el-mister/source/v0817-classes.dex.b64
          git diff --cached --quiet || git commit -m 'Prepare El Mister v0.8.17 scenario safety payload'
          git push origin HEAD:el-mister-updates
