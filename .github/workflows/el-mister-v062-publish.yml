name: Publish El Mister v0.6.2

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v062-publish.yml'
      - 'el-mister/v062-publish-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates

      - name: Reassemble and verify v0.6.2
        shell: bash
        run: |
          cat el-mister/build/v062/*.b64 | base64 -d > el-mister/El-Mister-v0.6.2.apk
          echo '5523c8d70c1de7e5907afdf68b8e22a994d144ea649bc3b314718c6dfe7d9e53  el-mister/El-Mister-v0.6.2.apk' | sha256sum -c -
          unzip -t el-mister/El-Mister-v0.6.2.apk
          jarsigner -verify el-mister/El-Mister-v0.6.2.apk
          mkdir -p el-mister/source/v062
          unzip -p el-mister/El-Mister-v0.6.2.apk assets/index.html > el-mister/source/v062/index.html
          grep -q "const VERSION='0.6.2'" el-mister/source/v062/index.html
          grep -q "const VERSION_CODE=13" el-mister/source/v062/index.html
          grep -q "function v062ShouldPause" el-mister/source/v062/index.html
          grep -q "function v062OpenSubsFromDecision" el-mister/source/v062/index.html
          grep -q "function v062StartLaneGame" el-mister/source/v062/index.html
          grep -q "function v062StartMemoryGame" el-mister/source/v062/index.html
          grep -q "function v062StartKeeperGame" el-mister/source/v062/index.html

      - name: Write updater feed
        shell: bash
        run: |
          cat > el-mister/latest.json <<'JSON'
          {
            "versionCode": 13,
            "versionName": "0.6.2",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.6.2.apk",
            "mandatory": false,
            "changes": [
              "Interrupciones de partido probabilísticas según intensidad y contexto, sin pausas rígidas",
              "Podés abrir Cambios desde una decisión y volver a la misma situación sin perderla",
              "Nuevos minijuegos de lectura de pase, memoria de centros y reflejos del arquero",
              "La dificultad de los minijuegos cambia según habilidad del jugador e importancia del partido"
            ],
            "sha256": "5523c8d70c1de7e5907afdf68b8e22a994d144ea649bc3b314718c6dfe7d9e53",
            "migration": true
          }
          JSON

      - name: Publish APK and updater feed
        shell: bash
        run: |
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.6.2.apk el-mister/source/v062/index.html el-mister/latest.json
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.6.2 via auto-updater'
          git push origin HEAD:el-mister-updates
