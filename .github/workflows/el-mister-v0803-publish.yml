name: Publish El Mister v0.8.3 contextual interventions

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0803-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Regression test — contextual decisions only
        run: |
          set -euo pipefail
          node --check el-mister/release/v0803/scenario-recovery.js
          node el-mister/release/v0803/test-scenario-recovery.js

      - name: Assemble v0.8.3 from published v0.8.2
        run: |
          set -euo pipefail
          rm -rf /tmp/v0803
          mkdir -p /tmp/v0803/work/assets /tmp/v0803/signature/META-INF
          cp el-mister/source/v0802-index.html /tmp/v0803/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0803/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.8.2';" not in s or 'const VERSION_CODE=38;' not in s:
              raise SystemExit('v0.8.2 markers not found')
          s=s.replace("const VERSION='0.8.2';", "const VERSION='0.8.3';", 1)
          s=s.replace('const VERSION_CODE=38;', 'const VERSION_CODE=39;', 1)
          fix=Path('el-mister/release/v0803/scenario-recovery.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+fix+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0803/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0803/full.js
          grep -q "const VERSION='0.8.3'" /tmp/v0803/index.html
          grep -q 'em803Create' /tmp/v0803/index.html
          grep -q 'em803Connected' /tmp/v0803/index.html
          grep -q 'launch79mini' /tmp/v0803/index.html
          grep -q 'MOTOR 2D' /tmp/v0803/index.html

      - name: Rebuild and verify signed APK
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0803/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0803/work/classes.dex
          cp /tmp/v0803/index.html /tmp/v0803/work/assets/index.html
          cd /tmp/v0803/work
          zip -q -r /tmp/v0803/El-Mister-v0.8.3.apk .
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0803-signed/MANIFEST.MF.b64" > /tmp/v0803/signature/META-INF/MANIFEST.MF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0803-signed/ELMISTER.SF.b64" > /tmp/v0803/signature/META-INF/ELMISTER.SF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0803-signed/ELMISTER.RSA.b64" > /tmp/v0803/signature/META-INF/ELMISTER.RSA
          cd /tmp/v0803/signature
          zip -q -g -r /tmp/v0803/El-Mister-v0.8.3.apk META-INF
          unzip -t /tmp/v0803/El-Mister-v0.8.3.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0803/El-Mister-v0.8.3.apk | tee /tmp/v0803/jarverify.txt
          grep -q 'jar verified' /tmp/v0803/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0803/expected.fp
          keytool -printcert -jarfile /tmp/v0803/El-Mister-v0.8.3.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0803/actual.fp
          diff -u /tmp/v0803/expected.fp /tmp/v0803/actual.fp
          unzip -p /tmp/v0803/El-Mister-v0.8.3.apk assets/index.html | grep -q "const VERSION='0.8.3'"
          unzip -p /tmp/v0803/El-Mister-v0.8.3.apk assets/index.html | grep -q 'em803Create'
          unzip -p /tmp/v0803/El-Mister-v0.8.3.apk assets/index.html | grep -q 'launch79mini'

      - name: Publish updater release
        run: |
          set -euo pipefail
          cp /tmp/v0803/El-Mister-v0.8.3.apk el-mister/El-Mister-v0.8.3.apk
          cp /tmp/v0803/index.html el-mister/source/v0803-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.8.3.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 39,
            "versionName": "0.8.3",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.8.3.apk",
            "mandatory": false,
            "changes": [
              "Eliminado el fallback que repetía siempre las mismas tres opciones genéricas",
              "Las intervenciones vuelven a priorizar situaciones reales del partido y secuencias ya existentes",
              "Se recuperan presión, laterales, delantero aislado, amarillas, cansancio, contras y jugadas enlazadas con minijuegos",
              "Se evita repetir la misma lectura táctica varias intervenciones seguidas",
              "El Motor 2D y su animación no fueron modificados"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.8.3.apk el-mister/latest.json el-mister/source/v0803-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.8.3 contextual intervention recovery'
          git push origin HEAD:el-mister-updates
