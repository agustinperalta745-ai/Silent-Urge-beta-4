name: Publish El Mister v0.8.4 scene sync

on:
  push:
    branches: [el-mister-updates]
    paths:
      - '.github/workflows/el-mister-v0804-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: el-mister-updates
          fetch-depth: 0

      - name: Regression test — scene sync only
        run: |
          set -euo pipefail
          node --check el-mister/release/v0804/scene-sync.js
          node el-mister/release/v0804/test-scene-sync.js

      - name: Assemble v0.8.4 from published v0.8.3
        run: |
          set -euo pipefail
          rm -rf /tmp/v0804
          mkdir -p /tmp/v0804/work/assets /tmp/v0804/signature/META-INF
          cp el-mister/source/v0803-index.html /tmp/v0804/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v0804/index.html')
          s=p.read_text(encoding='utf-8')
          if "const VERSION='0.8.3';" not in s or 'const VERSION_CODE=39;' not in s:
              raise SystemExit('v0.8.3 markers not found')
          s=s.replace("const VERSION='0.8.3';", "const VERSION='0.8.4';", 1)
          s=s.replace('const VERSION_CODE=39;', 'const VERSION_CODE=40;', 1)
          fix=Path('el-mister/release/v0804/scene-sync.js').read_text(encoding='utf-8')
          head,tail=s.rsplit('</script>',1)
          s=head+'\n'+fix+'\n</script>'+tail
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/v0804/full.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v0804/full.js
          grep -q "const VERSION='0.8.4'" /tmp/v0804/index.html
          grep -q 'const VERSION_CODE=40' /tmp/v0804/index.html
          grep -q 'em804StageScenario' /tmp/v0804/index.html
          grep -q 'em804PendingGoal' /tmp/v0804/index.html
          grep -q 'em803Create' /tmp/v0804/index.html
          grep -q 'launch79mini' /tmp/v0804/index.html
          grep -q 'MOTOR 2D' /tmp/v0804/index.html

      - name: Rebuild and verify signed APK
        run: |
          set -euo pipefail
          base64 -d el-mister/source/v074-AndroidManifest.xml.b64 > /tmp/v0804/work/AndroidManifest.xml
          base64 -d el-mister/source/v074-classes.dex.b64 > /tmp/v0804/work/classes.dex
          cp /tmp/v0804/index.html /tmp/v0804/work/assets/index.html
          cd /tmp/v0804/work
          zip -q -r /tmp/v0804/El-Mister-v0.8.4.apk .
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0804-signed/MANIFEST.MF.b64" > /tmp/v0804/signature/META-INF/MANIFEST.MF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0804-signed/ELMISTER.SF.b64" > /tmp/v0804/signature/META-INF/ELMISTER.SF
          base64 -d "$GITHUB_WORKSPACE/el-mister/release/v0804-signed/ELMISTER.RSA.b64" > /tmp/v0804/signature/META-INF/ELMISTER.RSA
          cd /tmp/v0804/signature
          zip -q -g -r /tmp/v0804/El-Mister-v0.8.4.apk META-INF
          unzip -t /tmp/v0804/El-Mister-v0.8.4.apk >/dev/null
          jarsigner -verify -verbose -certs /tmp/v0804/El-Mister-v0.8.4.apk | tee /tmp/v0804/jarverify.txt
          grep -q 'jar verified' /tmp/v0804/jarverify.txt
          keytool -printcert -file "$GITHUB_WORKSPACE/el-mister/release-cert.pem" | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0804/expected.fp
          keytool -printcert -jarfile /tmp/v0804/El-Mister-v0.8.4.apk | sed -n 's/.*SHA256: //p' | tr -d ': ' > /tmp/v0804/actual.fp
          diff -u /tmp/v0804/expected.fp /tmp/v0804/actual.fp
          unzip -p /tmp/v0804/El-Mister-v0.8.4.apk assets/index.html | grep -q "const VERSION='0.8.4'"
          unzip -p /tmp/v0804/El-Mister-v0.8.4.apk assets/index.html | grep -q 'em804StageScenario'
          unzip -p /tmp/v0804/El-Mister-v0.8.4.apk assets/index.html | grep -q 'em804PendingGoal'
          unzip -p /tmp/v0804/El-Mister-v0.8.4.apk assets/index.html | grep -q 'launch79mini'

      - name: Publish updater release
        run: |
          set -euo pipefail
          cp /tmp/v0804/El-Mister-v0.8.4.apk el-mister/El-Mister-v0.8.4.apk
          cp /tmp/v0804/index.html el-mister/source/v0804-index.html
          SHA=$(sha256sum el-mister/El-Mister-v0.8.4.apk | awk '{print $1}')
          cat > el-mister/latest.json <<EOF
          {
            "versionCode": 40,
            "versionName": "0.8.4",
            "apkUrl": "https://raw.githubusercontent.com/agustinperalta745-ai/Silent-Urge-beta-4/el-mister-updates/el-mister/El-Mister-v0.8.4.apk",
            "mandatory": false,
            "changes": [
              "La cancha de cada intervención ahora se acomoda a la situación que describe el texto: remates, penales, tiros libres, córners, mano a mano, salidas bajo presión, bandas y situaciones defensivas",
              "Un remate desde 28 metros ya muestra al jugador y la pelota realmente cerca del área rival, no en campo propio",
              "Cuando un gol nace de una decisión o minijuego, después de la tarjeta de GOL se ve la pelota entrar al arco y luego el rival saca desde el círculo central",
              "La animación normal del Motor 2D, sus pases, movimientos y físicas no fueron modificados"
            ],
            "onlineUrl": "https://el-mister-online.agustinperalta745.workers.dev",
            "sha256": "$SHA",
            "migration": true
          }
          EOF
          git config user.name 'El Mister Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add el-mister/El-Mister-v0.8.4.apk el-mister/latest.json el-mister/source/v0804-index.html
          git diff --cached --quiet || git commit -m 'Publish El Mister v0.8.4 coherent intervention scenes'
          git push origin HEAD:el-mister-updates
