function seedNum(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0} function prng(seed){let x=seed>>>0;return ()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function makeRoster(c){let rnd=prng(seedNum(c.id+'-roster-v2')),used=new Set();return POS.map((p,i)=>{let name;do{name=FIRST[Math.floor(rnd()*FIRST.length)]+' '+LAST[Math.floor(rnd()*LAST.length)]}while(used.has(name));used.add(name);let age=18+Math.floor(rnd()*17),delta=Math.round((rnd()-.5)*7)+(i<11?1:0),ovr=clamp(c.r-3+delta,48,91),val=Math.max(.04,((ovr-48)*(ovr-48)/155)*(age<24?1.18:age>30?.68:1));return {id:c.id+'p'+i,name,pos:p,age,ovr,value:+val.toFixed(2),morale:62+Math.floor(rnd()*21),relation:0,trait:TRAITS[Math.floor(rnd()*TRAITS.length)],injuredWeeks:0,stats:{apps:0,starts:0,goals:0,assists:0,ratingSum:0},promise:null}})}

function initLeague(div,simulateRounds=0){let ids=CLUBS.filter(c=>(S.worldDivs?.[c.id]||c.div)===div).map(c=>c.id);while(ids.length>10)ids.pop();if(ids.length<10){let extras=CLUBS.filter(c=>!ids.includes(c.id)).sort((a,b)=>Math.abs((S.worldDivs?.[a.id]||a.div)-div)-Math.abs((S.worldDivs?.[b.id]||b.div)-div));ids=ids.concat(extras.slice(0,10-ids.length).map(x=>x.id))}S.league={div,ids,schedule:schedule(ids),table:blankTable(ids)};for(let r=0;r<simulateRounds;r++)simulateRoundAI(r,true)}

function chooseCupOpponent(){if(S.cup.opponentId)return S.cup.opponentId;let idx=S.cup.roundIndex,d=S.worldDivs?.[S.clubId]||club(S.clubId).div,pool=CLUBS.filter(c=>c.id!==S.clubId);if(idx===0)pool=pool.filter(c=>(S.worldDivs?.[c.id]||c.div)>=3);else if(idx>=3)pool.sort((a,b)=>b.r-a.r);let candidates=idx>=3?pool.slice(0,18):shuffle(pool);let opp=pick(candidates.slice(0,Math.min(18,candidates.length)));S.cup.opponentId=opp.id;save();return opp.id}
function topShell(){let c=club(S.clubId),d=S.worldDivs?.[S.clubId]||S.league.div;return `<div class="top"><div class="brand"><div class="brandMark">EM</div><div class="brandText"><b>El Míster</b><span>Carrera v${VERSION}</span></div><div class="topClub"><b>${c.name}</b><span>${DIV_NAMES[d]} · T${S.season} F${S.week}</span></div></div></div>`}
function nav(){return `<div class="bottomNav">${[['home','⌂','Inicio'],['squad','♟','Plantel'],['league','▤','Competic.'],['contract','✎','Contrato'],['career','★','Carrera']].map(([v,i,l])=>`<button class="navBtn ${view===v?'active':''}" onclick="go('${v}')"><span class="ico">${i}</span>${l}</button>`).join('')}</div>`}
function go(v){view=v;render()}
function unresolvedImportant(){return (S.messages||[]).find(m=>m.important&&!m.resolved)}
function nextAction(){if(S.phase==='fired')return {e:'DESPEDIDO',t:'Elegir un nuevo club',d:'Tu etapa terminó. La carrera sigue, pero las ofertas disponibles serán de clubes de menor prestigio.',b:'Ver 3 contratos',a:'showFiredOffers()'};if(S.pendingJobOffer)return {e:'OFERTA DE TRABAJO',t:`${club(S.pendingJobOffer.clubId).name} te quiere`,d:'Tu buen rendimiento llamó la atención de un club con mayor prestigio.',b:'Revisar oferta',a:'showBetterOffer()'};if(S.phase==='task')return taskAction();if(S.phase==='weekStart')return {e:'NUEVA SEMANA',t:'Revisar agenda',d:'El juego ordenará mensajes, cantera, Copa y partido. No necesitás buscar qué hacer.',b:'Empezar semana',a:'startWeek()'};if(S.phase==='cupPrepare')return {e:'COPA NACIONAL',t:`${CUP_ROUNDS[S.cup.roundIndex]} de Copa`,d:'Partido de eliminación directa. Prepará el equipo y decidí cuánto querés arriesgar.',b:'Preparar Copa',a:"renderPrepare('cup')"};if(S.phase==='cupMatch')return {e:'DÍA DE COPA',t:'Jugar la eliminatoria',d:'En Copa no hay empate final: puede haber prórroga y penales.',b:'Jugar Copa',a:"beginMatch('cup')"};if(S.phase==='prepare')return {e:'PRÓXIMO PASO',t:'Preparar el partido de Liga',d:'Elegí formación y mentalidad. El once se arma automáticamente con los mejores disponibles.',b:'Preparar partido',a:"renderPrepare('league')"};if(S.phase==='match')return {e:'DÍA DE PARTIDO',t:'Dirigir el encuentro',d:'La simulación se frenará tres veces para que tomes decisiones reales.',b:'Jugar partido',a:"beginMatch('league')"};if(S.phase==='postCup')return {e:'POST COPA',t:'Revisar la eliminatoria',d:'Mirá el resultado y sus consecuencias antes de volver a la agenda semanal.',b:'Ver resumen',a:'renderPost()'};if(S.phase==='postLeague')return {e:'POST PARTIDO',t:'Revisar consecuencias',d:'Mirá cómo quedó tu situación antes de avanzar a la siguiente fecha.',b:'Ver resumen',a:'renderPost()'};if(S.phase==='seasonEnd')return {e:'FIN DE TEMPORADA',t:'Cerrar la temporada',d:'Se definieron ascensos, descensos y el cumplimiento de tu contrato.',b:'Ver balance',a:'renderSeasonEnd()'};return {e:'CARRERA',t:'Continuar',d:'Seguí con tu carrera.',b:'Continuar',a:'startWeek()'}}
function taskAction(){let t=S.activeTask;if(!t)return {e:'AGENDA',t:'Continuar semana',d:'No quedan asuntos pendientes.',b:'Continuar',a:'advanceWeekFlow()'};if(t.type==='message'){let m=S.messages.find(x=>x.id===t.id);return {e:'📱 CELULAR DEL DT',t:`Mensaje de ${m?.from||'un jugador'}`,d:m?.preview||'Hay un mensaje que requiere tu respuesta.',b:'Responder',a:`showMessage(${t.id})`}}if(t.type==='academy'){let y=S.academy.find(x=>x.id===t.id);return {e:'🌱 INFORME DE CANTERA',t:`Seguimiento de ${y?.name||'un juvenil'}`,d:'Tu cuerpo técnico necesita una decisión sobre su desarrollo.',b:'Ver informe',a:`showAcademyReport('${t.id}')`}}return {e:'SITUACIÓN DEL CLUB',t:t.data.t,d:t.data.d,b:'Tomar una decisión',a:'renderGeneralDecision()'}}
function phoneCardHtml(){let unread=(S.messages||[]).filter(m=>!m.read).length,latest=[...(S.messages||[])].sort((a,b)=>b.id-a.id)[0];return `<div class="phoneCard"><div class="phoneIcon">📱</div><div class="grow"><div class="row"><b>Celular del DT</b>${unread?`<span class="badge">${unread}</span>`:''}</div><div class="muted small" style="margin-top:4px">${latest?`${latest.from}: ${latest.preview}`:'Sin mensajes nuevos'}</div></div><button class="secondary" style="width:auto;padding:10px" onclick="showPhone()">Abrir</button></div>`}
function renderHome(){let c=club(S.clubId),f=currentFixture(),na=nextAction(),pos=tablePos(),opp=f?club(f.opponent):null,confClass=S.confidence<30?'bad':S.confidence<50?'warn':'good';return `${topShell()}<div class="content"><div class="card hero"><div class="eyebrow">${na.e}</div><h1>${na.t}</h1><p>${na.d}</p><button class="primary" onclick="${na.a}">${na.b}</button></div>${phoneCardHtml()}${S.confidence<30?`<div class="notice bad"><b>La directiva está preocupada.</b> Tu confianza está en ${S.confidence}/100.</div>`:''}<div class="grid2"><div class="metric"><small>Posición</small><b>${pos}º</b></div><div class="metric"><small>Reputación DT</small><b>${S.reputation}</b></div></div><div class="card"><div class="row between"><div class="sectionTitle" style="margin:0">Estado del proyecto</div><span class="pill ${confClass}">Confianza ${S.confidence}</span></div><div class="barWrap"><div class="barLine"><span>Directiva</span><b>${S.confidence}/100</b></div><div class="bar ${S.confidence<30?'red':S.confidence<50?'gold':''}"><i style="width:${S.confidence}%"></i></div></div><div class="barWrap"><div class="barLine"><span>Reputación</span><b>${S.reputation}/100</b></div><div class="bar gold"><i style="width:${S.reputation}%"></i></div></div></div>${cupDue()?`<div class="card"><span class="cupBadge">🏆 ${CUP_ROUNDS[S.cup.roundIndex]}</span><div class="small muted" style="margin-top:9px">Esta semana también tenés Copa Interdivisional.</div></div>`:''}${opp?`<div class="card"><div class="sectionTitle">Próximo partido de Liga · Fecha ${S.week}</div><div class="fixture"><div class="teamMini">${shield(club(f.home),'sm')}${club(f.home).name}</div><div class="vs">VS</div><div class="teamMini">${shield(club(f.away),'sm')}${club(f.away).name}</div></div></div>`:''}<div class="grid3"><div class="metric"><small>PG</small><b>${S.stint.w}</b></div><div class="metric"><small>PE</small><b>${S.stint.d}</b></div><div class="metric"><small>PP</small><b>${S.stint.l}</b></div></div></div>${nav()}`}
const FORMATION_SLOTS={
'4-3-3':[{pos:'EI',x:18,y:19},{pos:'DC',x:50,y:15},{pos:'ED',x:82,y:19},{pos:'MC',x:29,y:44},{pos:'MCD',x:50,y:55},{pos:'MC',x:71,y:44},{pos:'LI',x:15,y:72},{pos:'DFC',x:38,y:75},{pos:'DFC',x:62,y:75},{pos:'LD',x:85,y:72},{pos:'ARQ',x:50,y:90}],
'4-2-3-1':[{pos:'DC',x:50,y:15},{pos:'EI',x:19,y:36},{pos:'MCO',x:50,y:34},{pos:'ED',x:81,y:36},{pos:'MCD',x:36,y:56},{pos:'MCD',x:64,y:56},{pos:'LI',x:15,y:72},{pos:'DFC',x:38,y:75},{pos:'DFC',x:62,y:75},{pos:'LD',x:85,y:72},{pos:'ARQ',x:50,y:90}],
'4-4-2':[{pos:'DC',x:36,y:17},{pos:'DC',x:64,y:17},{pos:'EI',x:17,y:43},{pos:'MC',x:39,y:48},{pos:'MC',x:61,y:48},{pos:'ED',x:83,y:43},{pos:'LI',x:15,y:72},{pos:'DFC',x:38,y:75},{pos:'DFC',x:62,y:75},{pos:'LD',x:85,y:72},{pos:'ARQ',x:50,y:90}]
};
function positionalFit(p,target){if(!p)return-999;if(p.pos===target)return 46;let rel={ARQ:[],DFC:['LD','LI','MCD'],LD:['DFC','ED'],LI:['DFC','EI'],MCD:['MC','DFC'],MC:['MCD','MCO'],MCO:['MC','EI','ED','DC'],EI:['ED','MCO','DC','LI'],ED:['EI','MCO','DC','LD'],DC:['EI','ED','MCO']};let a=rel[target]||[];return a.includes(p.pos)?20:0}
function automaticLineupIds(form=S.formation||'4-2-3-1'){let slots=FORMATION_SLOTS[form]||FORMATION_SLOTS['4-2-3-1'],pool=S.roster.filter(p=>!(p.injuredWeeks>0)),chosen=[];for(let slot of slots){let cand=pool.filter(p=>!chosen.includes(p.id)).sort((a,b)=>(positionalFit(b,slot.pos)+b.ovr)-(positionalFit(a,slot.pos)+a.ovr))[0];if(cand)chosen.push(cand.id)}for(let p of [...pool].sort((a,b)=>b.ovr-a.ovr)){if(chosen.length>=11)break;if(!chosen.includes(p.id))chosen.push(p.id)}return chosen.slice(0,11)}
function ensureLineup(){let valid=new Set(S.roster.map(p=>p.id));let ids=Array.isArray(S.lineupIds)?S.lineupIds.filter(id=>valid.has(id)):[];if(!ids.length)ids=automaticLineupIds();let fill=automaticLineupIds();for(let id of fill){if(ids.length>=11)break;if(!ids.includes(id))ids.push(id)}if(ids.length<11){for(let p of [...S.roster].sort((a,b)=>b.ovr-a.ovr)){if(ids.length>=11)break;if(!ids.includes(p.id))ids.push(p.id)}}S.lineupIds=ids.slice(0,11);return S.lineupIds}
function bestXI(){let ids=ensureLineup(),xi=ids.map(id=>S.roster.find(p=>p.id===id)).filter(p=>p&&!(p.injuredWeeks>0));for(let p of [...S.roster].filter(p=>!(p.injuredWeeks>0)).sort((a,b)=>b.ovr-a.ovr)){if(xi.length>=11)break;if(!xi.some(x=>x.id===p.id))xi.push(p)}return xi.slice(0,11)}
function assignedLineup(){let slots=FORMATION_SLOTS[S.formation]||FORMATION_SLOTS['4-2-3-1'],pool=ensureLineup().map(id=>S.roster.find(p=>p.id===id)).filter(Boolean),used=new Set(),out=[];for(let slot of slots){let cand=pool.filter(p=>!used.has(p.id)).sort((a,b)=>(positionalFit(b,slot.pos)+b.ovr)-(positionalFit(a,slot.pos)+a.ovr))[0];if(cand){used.add(cand.id);out.push({slot,p:cand})}}return out}
function squadNumber(p){let i=S.roster.findIndex(x=>x.id===p.id);return i<0?'':i+1}
function surname(p){let a=(p?.name||'').trim().split(/\s+/);return a[a.length-1]||p?.name||''}
function selectStarter(id){selectedStarterId=selectedStarterId===id?null:id;render()}
function swapStarter(subId){if(!selectedStarterId){toast('Primero tocá un titular en la cancha.');return}let ids=ensureLineup(),idx=ids.indexOf(selectedStarterId),sub=S.roster.find(p=>p.id===subId);if(idx<0||!sub)return;if(sub.injuredWeeks>0){toast('Ese jugador está lesionado.');return}ids[idx]=subId;S.lineupIds=ids;selectedStarterId=null;save();render();toast('Cambio guardado en el once.')}
function cycleFormation(dir){let forms=['4-2-3-1','4-3-3','4-4-2'],cur=S.formation||'4-2-3-1',i=forms.indexOf(cur);i=(i+dir+forms.length)%forms.length;S.formation=forms[i];formation=S.formation;selectedStarterId=null;save();render()}
function renderSquad(){let c=club(S.clubId),roster=S.roster,avg=Math.round(roster.reduce((a,p)=>a+p.ovr,0)/roster.length),head=`${topShell()}<div class="content"><div class="card"><div class="row between"><div><div class="eyebrow">PLANTEL</div><h2 style="margin:4px 0 0">${c.name}</h2></div>${shield(c,'sm')}</div><div class="grid3" style="margin-top:14px"><div class="metric"><small>Media</small><b>${avg}</b></div><div class="metric"><small>Jugadores</small><b>${roster.length}</b></div><div class="metric"><small>Moral</small><b>${S.morale}</b></div></div></div><div class="subtabs"><button class="subtab ${squadTab==='first'?'active':''}" onclick="squadTab='first';selectedAcademyId=null;render()">Primer equipo</button><button class="subtab ${squadTab==='academy'?'active':''}" onclick="squadTab='academy';selectedStarterId=null;render()">Cantera</button></div>`;return head+(squadTab==='academy'?renderAcademyHtml():renderFirstTeamHtml())+`</div>${nav()}`}
function renderFirstTeamHtml(){ensureLineup();let assigned=assignedLineup(),lineupSet=new Set(S.lineupIds),bench=[...S.roster].filter(p=>!lineupSet.has(p.id)).sort((a,b)=>(a.injuredWeeks>0)-(b.injuredWeeks>0)||b.ovr-a.ovr),selected=S.roster.find(p=>p.id===selectedStarterId),pitch=assigned.map(({slot,p})=>`<button class="pitchPlayer ${selectedStarterId===p.id?'selected':''} ${p.injuredWeeks?'unavailable':''}" style="left:${slot.x}%;top:${slot.y}%" onclick="selectStarter('${p.id}')"><div class="shirtMini ${p.pos==='ARQ'?'gk':''}">${squadNumber(p)}</div><div class="pitchTopline"><span class="pitchSlot">${slot.pos}</span><span class="pitchOvr">${p.ovr}</span></div><div class="pitchName">${surname(p)}</div></button>`).join(''),benchHtml=bench.map(p=>`<div class="benchPlayer ${p.injuredWeeks?'unavailable':''}"><div class="benchInfo"><div class="shirtMini ${p.pos==='ARQ'?'gk':''}">${squadNumber(p)}</div><div><div><span class="benchPos">${p.pos}</span> <span class="benchOvr">${p.ovr}</span></div><div class="benchName">${surname(p)}</div></div></div><button class="benchChange" onclick="swapStarter('${p.id}')" ${p.injuredWeeks?'disabled':''}>Cambiar</button></div>`).join('');return `<div class="card squadTacticalCard"><div class="formationBar"><button class="formationArrow" onclick="cycleFormation(-1)">‹</button><div class="formationName">Formación: ${S.formation||'4-2-3-1'}</div><button class="formationArrow" onclick="cycleFormation(1)">›</button></div><div class="tacticalBoard"><div class="footballPitch"><div class="pitchBoxTop"></div><div class="pitchBoxBottom"></div>${pitch}</div><div class="benchPanel"><div class="benchTitle">Suplentes (${bench.length})</div><div class="benchList">${benchHtml||'<div class="muted small center">Sin suplentes</div>'}</div></div></div><div class="squadHelper">${selected?`Seleccionaste a <b>${selected.name}</b>. Tocá <b>Cambiar</b> en un suplente.`:'Tocá un titular en la cancha y después <b>Cambiar</b> en un suplente.'}</div></div>`}
function selectAcademy(id){selectedAcademyId=selectedAcademyId===id?null:id;render()}

function renderCareer(){let c=club(S.clubId),hist=[...(S.career.clubs||[])];hist.push({clubId:S.clubId,startSeason:S.stint.startSeason,endSeason:S.season,w:S.stint.w,d:S.stint.d,l:S.stint.l,current:true});let h=hist.reverse().map(x=>{let cc=club(x.clubId);return `<div class="histItem"><b>${cc.name}${x.current?' · Actual':''}</b><p>Temporada ${x.startSeason}${x.endSeason&&x.endSeason!==x.startSeason?'–'+x.endSeason:''} · ${x.w||0} G / ${x.d||0} E / ${x.l||0} P</p></div>`}).join('');return `${topShell()}<div class="content"><div class="card center">${shield(c,'lg')}<div class="eyebrow">${S.manager}</div><div class="big" style="margin:5px 0">Reputación ${S.reputation}</div><div class="muted small">${rankName(S.reputation)} · Temporada ${S.season}</div></div><div class="grid2"><div class="metric"><small>Victorias</small><b>${S.career.wins}</b></div><div class="metric"><small>Ascensos</small><b>${S.career.promotions}</b></div><div class="metric"><small>Copas</small><b>${S.career.cups||0}</b></div><div class="metric"><small>Despidos</small><b>${S.career.firings}</b></div></div><div class="card"><div class="sectionTitle">Trayectoria</div><div class="history">${h}</div></div>${S.career.memorable?.length?`<div class="card"><div class="sectionTitle">Momentos memorables</div>${S.career.memorable.slice(-5).reverse().map(x=>`<div class="msg"><b>${x.title}</b><div class="msgBody">${x.text}</div></div>`).join('')}</div>`:''}<div class="card"><div class="sectionTitle">Aplicación</div><div class="row between"><div><b>El Míster v${VERSION}</b><div class="muted small">Actualizador activado</div></div><button class="secondary" style="width:auto;padding:10px 12px" onclick="checkForUpdates(true)">Buscar actualización</button></div></div><div class="card"><button class="secondary danger" onclick="confirmReset()">Empezar una carrera nueva</button></div></div>${nav()}`}
function rankName(r){if(r<25)return 'DT desconocido';if(r<45)return 'Promesa';if(r<65)return 'Reconocido';if(r<82)return 'Prestigioso';return 'Élite'}
function render(){if(!S){startFlow();return}let html=view==='home'?renderHome():view==='squad'?renderSquad():view==='league'?renderLeague():view==='contract'?renderContract():renderCareer();root().innerHTML=`<div class="app">${html}</div>`}
function progressWeekStatuses(){S.roster.forEach(p=>{if(p.injuredWeeks>0)p.injuredWeeks--;if(p.promise){p.promise.weeks--;if(p.promise.weeks<=0){let kept=p.stats.starts>(p.promise.startsAt||0);if(!kept){p.morale=clamp(p.morale-8,20,100);p.relation=clamp(p.relation-3,-10,10);addMessage(p.name,'No cumpliste la promesa de darme más minutos. Necesito saber si realmente cuento para vos.','Promesa incumplida',false)}else{p.morale=clamp(p.morale+4,20,100);p.relation=clamp(p.relation+2,-10,10)}p.promise=null}}})}
function addMessage(from,body,preview=body.slice(0,48),important=false,options=null,playerId=null){let m={id:S.nextMessageId++,from,body,preview,important,options,playerId,resolved:!important,read:false,week:S.week,season:S.season};S.messages.push(m);return m}
function maybeGenerateMessage(){if(Math.random()>.42)return null;let healthy=S.roster.filter(p=>!p.injuredWeeks),p=pick(healthy),lowUse=p.stats.starts<Math.max(1,S.week/3),roll=Math.random();if(lowUse&&roll<.58){return addMessage(p.name,'Míster, siento que estoy entrenando bien y casi no tengo oportunidades. Necesito más minutos.','Quiero hablar de mis minutos',true,[{t:'Prometerle oportunidades',e:{morale:5,relation:2,promise:true}},{t:'Decirle que debe ganarse el puesto',e:{morale:1,relation:0}},{t:'Decirle que no entra en tus planes',e:{morale:-7,relation:-3}}],p.id)}if(roll<.78)return addMessage(p.name,'Gracias por la confianza. Estoy cómodo con el grupo y voy a dejar todo cuando me toque.','Gracias por la confianza',false,null,p.id);return addMessage(p.name,'Míster, me gustaría asumir más responsabilidad en el grupo. Creo que puedo ser uno de los referentes.','Quiero más responsabilidad',true,[{t:'Darle más liderazgo',e:{morale:4,relation:2,discipline:1}},{t:'Decirle que espere su momento',e:{morale:0,relation:0}},{t:'Rechazar el pedido',e:{morale:-4,relation:-2}}],p.id)}
function startWeek(){if(S.week>18){S.phase='seasonEnd';save();render();return}if(!S.weekFlow||S.weekFlow.week!==S.week){progressWeekStatuses();let tasks=[],m=maybeGenerateMessage();if(m?.important)tasks.push({type:'message',id:m.id});if(S.week%4===0&&S.academy?.length){let y=pick(S.academy);tasks.push({type:'academy',id:y.id})}if(Math.random()<(S.week===1 ? .4 : .28))tasks.push({type:'decision',data:JSON.parse(JSON.stringify(pick(DECISIONS)))});S.weekFlow={week:S.week,tasks,cupDone:false};S.activeTask=null}advanceWeekFlow()}
function advanceWeekFlow(){if(S.weekFlow?.tasks?.length){S.activeTask=S.weekFlow.tasks.shift();S.phase='task'}else{S.activeTask=null;S.phase=cupDue()?'cupPrepare':'prepare'}save();closeModal();render()}
function renderGeneralDecision(){let d=S.activeTask?.data;if(!d)return advanceWeekFlow();openModal(`<div class="eyebrow">DECISIÓN</div><h2>${d.t}</h2><p>${d.d}</p><div class="divider"></div>${d.o.map((o,i)=>`<button class="choice" onclick="resolveGeneralDecision(${i})"><b>${o[0]}</b><span>${choiceHint(o[1])}</span></button>`).join('')}`)}
function choiceHint(e){let a=[];if(e.conf)a.push(`Directiva ${signed(e.conf)}`);if(e.morale)a.push(`Moral ${signed(e.morale)}`);if(e.discipline)a.push(`Disciplina ${signed(e.discipline)}`);if(e.rep)a.push(`Reputación ${signed(e.rep)}`);if(e.form)a.push(`Forma ${signed(e.form)}`);return a.join(' · ')||'Consecuencias variables'}
function applyEffects(e){S.confidence=clamp(S.confidence+(e.conf||0),0,100);S.morale=clamp(S.morale+(e.morale||0),25,100);S.discipline=clamp(S.discipline+(e.discipline||0),20,100);S.reputation=clamp(S.reputation+(e.rep||0),0,100);S.form=clamp((S.form||0)+(e.form||0),-8,8);S.injuryRisk=clamp((S.injuryRisk||0)+(e.injury||0),0,10)}
function resolveGeneralDecision(i){let d=S.activeTask.data,choice=d.o[i][0],e=d.o[i][1];applyEffects(e);save();showConsequence({type:consequenceTone(e),icon:consequenceTone(e)==='danger'?'⚠️':consequenceTone(e)==='success'?'✅':'🧠',title:'Decisión tomada',text:`${d.t}: ${choice}.`,effects:consequenceEffects(e),duration:3000,onDone:advanceWeekFlow})}
function showPhone(){S.messages.forEach(m=>m.read=true);save();let msgs=[...S.messages].sort((a,b)=>b.id-a.id).slice(0,12);openModal(`<div class="eyebrow">📱 CELULAR DEL DT</div><h2>Mensajes</h2><p>Quejas, agradecimientos y pedidos del plantel llegan acá. Los asuntos obligatorios también aparecen en Próximo paso.</p>${msgs.length?msgs.map(m=>`<div class="msg"><div class="msgHead"><b>${m.from}</b>${m.important&&!m.resolved?'<span class="pill bad">Responder</span>':''}</div><div class="msgBody">${m.body}</div><div class="msgMeta">T${m.season} · Semana ${m.week}</div>${m.important&&!m.resolved?`<button class="secondary" style="margin-top:8px" onclick="showMessage(${m.id})">Responder ahora</button>`:''}</div>`).join(''):'<div class="muted small">No hay mensajes.</div>'}<div style="height:10px"></div><button class="secondary" onclick="closeModal();render()">Cerrar</button>`)}
function showMessage(id){let m=S.messages.find(x=>x.id===id);if(!m)return advanceWeekFlow();m.read=true;save();openModal(`<div class="eyebrow">📱 ${m.from}</div><h2>${m.preview}</h2><p>${m.body}</p>${(m.options||[]).map((o,i)=>`<button class="choice" onclick="resolveMessage(${id},${i})"><b>${o.t}</b><span>La respuesta afectará la relación y el ánimo del jugador.</span></button>`).join('')}`)}
function resolveMessage(id,i){let m=S.messages.find(x=>x.id===id),o=m?.options?.[i];if(!m||!o)return;let p=S.roster.find(x=>x.id===m.playerId);if(p){p.morale=clamp(p.morale+(o.e.morale||0),20,100);p.relation=clamp(p.relation+(o.e.relation||0),-10,10);if(o.e.promise)p.promise={weeks:3,startsAt:p.stats.starts}}applyEffects(o.e);m.resolved=true;m.read=true;save();let fx=consequenceEffects(o.e);if(o.e.promise)fx.push('Promesa: 3 semanas');showConsequence({type:consequenceTone(o.e),icon:consequenceTone(o.e)==='danger'?'💢':'📱',title:'Respuesta enviada',text:`Le respondiste a ${m.from}: “${o.t}”.`,effects:fx,duration:2800,onDone:advanceWeekFlow})}
function showAcademyReport(id,fromPanel=false){let y=S.academy.find(x=>x.id===id);if(!y){if(fromPanel){closeModal();render();return}return advanceWeekFlow()}openModal(`<div class="eyebrow">🌱 INFORME DE CANTERA</div><h2>${y.name}</h2><p>${y.age} años · ${y.pos} · Media ${y.ovr}. El cuerpo técnico estima un potencial de ${y.potMin}–${y.potMax}.</p><div class="notice"><b>${y.trait}</b> es el rasgo que más destaca en los informes actuales.</div><button class="choice" onclick="academyDecision('${id}','promote',${fromPanel})"><b>Subirlo al primer equipo</b><span>Puede acelerar su experiencia, pero ocupará un lugar en la plantilla.</span></button><button class="choice" onclick="academyDecision('${id}','focus',${fromPanel})"><b>Plan individual de desarrollo</b><span>Mejora su progresión y afina la estimación de potencial.</span></button><button class="choice" onclick="academyDecision('${id}','observe',${fromPanel})"><b>Seguir observándolo</b><span>No apresurás su proceso y obtenés un informe más preciso.</span></button>`)}
function academyDecision(id,type,fromPanel=false){let y=S.academy.find(x=>x.id===id);if(!y)return;let title='Informe actualizado',text='',fx=[],tone='info',icon='🌱';if(type==='promote'){S.academy=S.academy.filter(x=>x.id!==id);S.roster.push(normalizePlayer({id:y.id,name:y.name,pos:y.pos,age:y.age,ovr:y.ovr,value:+Math.max(.05,(y.ovr-45)/40).toFixed(2),morale:82,relation:2,trait:y.trait,injuredWeeks:0,stats:{apps:0,starts:0,goals:0,assists:0,ratingSum:0}}));S.confidence=clamp(S.confidence+1,0,100);S.reputation=clamp(S.reputation+1,0,100);addMessage(y.name,'Gracias, míster. No voy a desaprovechar esta oportunidad con el primer equipo.','Gracias por hacerme debutar',false,null,y.id);title='¡Sube al primer equipo!';text=`${y.name} ya forma parte del plantel profesional.`;fx=['Directiva +1','Reputación +1'];tone='success';icon='🌟'}else if(type==='release'){S.academy=S.academy.filter(x=>x.id!==id);title='Juvenil liberado';text=`${y.name} deja la academia y queda libre.`;fx=['Cantera -1 jugador'];tone='warn';icon='👋'}else if(type==='focus'){let before=y.ovr;y.ovr=clamp(y.ovr+ri(0,1),40,88);y.potMin=clamp(y.potMin+2,y.ovr,y.potential);y.potMax=clamp(y.potMax-1,y.potential,92);title='Plan individual';text=`${y.name} tendrá un seguimiento especial de desarrollo.`;fx=[`Media ${before} → ${y.ovr}`,`Potencial ${y.potMin}–${y.potMax}`]}else{y.potMin=clamp(y.potMin+1,y.ovr,y.potential);y.potMax=clamp(y.potMax-1,y.potential,92);text=`Seguirás observando a ${y.name} antes de tomar una decisión.`;fx=[`Potencial ${y.potMin}–${y.potMax}`]}selectedAcademyId=null;save();let done=fromPanel?()=>{closeModal();render()}:advanceWeekFlow;showConsequence({type:tone,icon,title,text,effects:fx,duration:2800,onDone:done})}

function renderPrepare(mode='league'){let f=mode==='cup'?null:currentFixture(),opp=mode==='cup'?club(chooseCupOpponent()):club(f.opponent),isHome=mode==='cup'?Math.random()<.5:f.isHome;S.pendingPrepare={mode,oppId:opp.id,isHome};let xi=bestXI();openModal(`<div class="eyebrow">${mode==='cup'?`🏆 ${CUP_ROUNDS[S.cup.roundIndex]}`:`FECHA ${S.week}`}</div><h2>Preparar vs ${opp.name}</h2><p>${isHome?'Jugás de local.':'Jugás de visitante.'} Tu plantel ${club(S.clubId).r} · rival ${opp.r}.</p><div class="notice"><b>Once sugerido:</b> ${xi.slice(0,4).map(p=>p.name.split(' ')[1]).join(', ')}… ${S.roster.some(p=>p.injuredWeeks)?'Los lesionados quedan fuera automáticamente.':''}</div><div class="sectionTitle">Formación</div><div class="grid3">${['4-2-3-1','4-3-3','4-4-2'].map(x=>`<button class="tab ${formation===x?'active':''}" onclick="formation='${x}';renderPrepare('${mode}')">${x}</button>`).join('')}</div><div class="sectionTitle" style="margin-top:16px">Mentalidad</div>${[['Ofensivo','Generás más peligro, con mayor riesgo atrás.'],['Equilibrado','Plan estable para leer el partido.'],['Defensivo','Reducís espacios y protegés el resultado.']].map(([x,d])=>`<button class="choice ${tacticalChoice===x?'selected':''}" onclick="tacticalChoice='${x}';renderPrepare('${mode}')"><b>${x}</b><span>${d}</span></button>`).join('')}<button class="primary" onclick="confirmPrepare('${mode}')">Confirmar plan</button>`)}
function confirmPrepare(mode){S.tactic=tacticalChoice;S.formation=formation;S.phase=mode==='cup'?'cupMatch':'match';save();closeModal();render();toast('Plan confirmado.')}
function beginMatch(mode){let f;if(mode==='cup'){let opp=chooseCupOpponent(),isHome=S.pendingPrepare?.mode==='cup'?S.pendingPrepare.isHome:Math.random()<.5;f={home:isHome?S.clubId:opp,away:isHome?opp:S.clubId,opponent:opp,isHome}}else f=currentFixture();if(!f)return;S.live={mode,home:f.home,away:f.away,opponent:f.opponent,isHome:f.isHome,gh:0,ga:0,minute:0,stopIndex:0,userAttack:0,userDefense:0,fatigue:0,moraleMod:0,events:[],decisions:[],shootoutTakers:[],pens:null};save();closeModal();runNextStop()}
function scoreForUser(l=S.live){return l.isHome?l.gh:l.ga} function scoreAgainst(l=S.live){return l.isHome?l.ga:l.gh}
function teamGoal(teamId,m,source='jugada'){let l=S.live,roster=teamId===S.clubId?S.roster:makeRoster(club(teamId)),attackers=roster.filter(p=>['DC','EI','ED','MCO','MC'].includes(p.pos)&&!(p.injuredWeeks>0)),p=pick(attackers.length?attackers:roster);if(teamId===l.home)l.gh++;else l.ga++;l.events.push({m,type:'goal',teamId,playerId:teamId===S.clubId?p.id:null,txt:`⚽ ${p.name} — ${source}`})}
function simulateSegment(to){let l=S.live,home=club(l.home),away=club(l.away);for(let m=Math.max(5,Math.ceil((l.minute+1)/5)*5);m<=to;m+=5){let diff=(home.r-away.r)*.0019,ph=.054+diff+.007,pa=.051-diff,ua=l.isHome?l.userAttack:l.userDefense*-1,ud=l.isHome?l.userDefense:l.userAttack,va=l.isHome?l.userDefense:l.userAttack,vdef=l.isHome?l.userAttack:l.userDefense;if(l.home===S.clubId){ph+=l.userAttack;pa-=l.userDefense}else{pa+=l.userAttack;ph-=l.userDefense}let tac=S.tactic;if(l.home===S.clubId||l.away===S.clubId){if(tac==='Ofensivo'){if(l.home===S.clubId){ph+=.012;pa+=.006}else{pa+=.012;ph+=.006}}if(tac==='Defensivo'){if(l.home===S.clubId){ph-=.006;pa-=.012}else{pa-=.006;ph-=.012}}}ph=clamp(ph,.012,.14);pa=clamp(pa,.012,.14);if(Math.random()<ph)teamGoal(l.home,m);if(Math.random()<pa)teamGoal(l.away,m);if(Math.random()<.018)l.events.push({m,type:'card',txt:'🟨 Tarjeta amarilla tras una entrada fuerte'})}l.minute=to;save()}
function runNextStop(){let l=S.live,stops=[28,56,79];if(l.stopIndex>=3){simulateSegment(90);return finishRegulation()}let target=stops[l.stopIndex];simulateSegment(target);l.scenario=makeMatchScenario(l.stopIndex);renderLiveDecision()}
function makeMatchScenario(idx){let l=S.live,us=scoreForUser(l),them=scoreAgainst(l),r=Math.random();if(r<.14)return makeKeyPlay(idx);if(r<.25)return makeRareEvent(idx);let minute=l.minute;if(us<them)return {kind:'tactical',t:'Necesitás cambiar el partido',d:`Minuto ${minute}. Estás ${us}-${them} y el rival está cómodo.`,o:[{t:'Presión alta y adelantar líneas',h:'Más llegadas, más cansancio y espacios.',e:{att:.025,def:-.012,fat:2}},{t:'Sumar un atacante',h:'Aumenta tu amenaza en el área.',e:{att:.018,def:-.007,fat:1}},{t:'Mantener el plan',h:'Conservás estructura y esperás tu momento.',e:{att:.004,def:.004}}]};if(us>them)return {kind:'tactical',t:'Administrar la ventaja',d:`Minuto ${minute}. Ganás ${us}-${them}.`,o:[{t:'Cerrar espacios',h:'Protegés el resultado, cedés iniciativa.',e:{att:-.01,def:.025}},{t:'Seguir igual',h:'No cambiás el equilibrio del equipo.',e:{att:.003,def:.003}},{t:'Buscar el segundo de contra',h:'Más amenaza, pero asumís riesgos.',e:{att:.018,def:-.009,fat:1}}]};return {kind:'tactical',t:'El partido está abierto',d:`Minuto ${minute}. El marcador está ${us}-${them}.`,o:[{t:'Atacar por las bandas',h:'Subís laterales y generás centros.',e:{att:.016,def:-.006,fat:1}},{t:'Controlar el mediocampo',h:'Menos riesgo y más posesión.',e:{att:.005,def:.012}},{t:'Juego directo',h:'Buscás llegar rápido al área.',e:{att:.014,def:-.004,fat:1}}]}}
function makeKeyPlay(idx){let l=S.live,minute=l.minute,roster=bestXI(),taker=roster.filter(p=>['DC','MCO','MC','EI','ED'].includes(p.pos)).sort((a,b)=>b.ovr-a.ovr)[0]||roster[0],type=pick(['penalty','freekick','corner']);if(type==='penalty')return {kind:'keyplay',key:'penalty',playerId:taker.id,t:'¡Penal para tu equipo!',d:`${minute}' · ${taker.name} toma la pelota. ¿Dónde le indicás patear?`,o:[{t:'Izquierda',h:'Buscar el palo izquierdo.',side:'L'},{t:'Centro',h:'Esperar que el arquero se juegue.',side:'C'},{t:'Derecha',h:'Buscar el palo derecho.',side:'R'}]};if(type==='freekick')return {kind:'keyplay',key:'freekick',playerId:taker.id,t:'Tiro libre peligroso',d:`${minute}' · Falta a unos 24 metros.`,o:[{t:'Pegarle al arco',h:`La ejecuta ${taker.name}.`,play:'shot'},{t:'Tirar el centro',h:'Buscás ganar por arriba.',play:'cross'},{t:'Jugada preparada',h:'Más imprevisible, también más arriesgada.',play:'set'}]};return {kind:'keyplay',key:'corner',playerId:taker.id,t:'Córner a favor',d:`${minute}' · Una buena pelota parada puede romper el partido.`,o:[{t:'Primer palo',h:'Movimiento corto y agresivo.',play:'near'},{t:'Segundo palo',h:'Buscás a los jugadores altos.',play:'far'},{t:'Jugar corto',h:'Conservás la pelota y buscás otro ángulo.',play:'short'}]}}
function makeRareEvent(idx){let l=S.live,minute=l.minute;if(idx===1&&Math.random()<.45)return {kind:'rare',key:'locker',t:'Discusión en el vestuario',d:'Dos titulares se cruzaron fuerte durante el entretiempo y la tensión sigue en el grupo.',o:[{t:'Retar a los dos',h:'Marcás autoridad, puede enfriar al equipo.',e:{morale:-1,def:.006}},{t:'Reunir al grupo y cortar la discusión',h:'Buscás recuperar concentración.',e:{morale:2,att:.005,def:.005}},{t:'Respaldar al capitán',h:'Puede ordenar al grupo, pero deja un jugador molesto.',e:{morale:1,def:.009}}]};if(Math.random()<.55){let p=pick(bestXI());return {kind:'rare',key:'injury',playerId:p.id,t:'Molestia muscular',d:`${minute}' · ${p.name} siente un pinchazo. El médico dice que puede seguir, pero existe riesgo.`,o:[{t:'Cambiarlo de inmediato',h:'Protegés al jugador y evitás agravar la lesión.',action:'sub'},{t:'Dejarlo seguir',h:'Mantenés calidad, con riesgo de una lesión seria.',action:'risk'},{t:'Bajar la intensidad',h:'Sigue jugando, pero el equipo pierde algo de agresividad.',action:'slow'}]}}return {kind:'rare',key:'crowd',t:'Incidentes en la tribuna',d:`${minute}' · El árbitro detiene el juego por problemas entre hinchas. Tus jugadores pierden concentración.`,o:[{t:'Reunir al equipo en el campo',h:'Intentás mantenerlos mentalmente activos.',e:{morale:1,def:.006}},{t:'Mandarlos al vestuario',h:'Baja tensión, pero enfría al equipo.',e:{fat:1,att:-.004}},{t:'Hablar con el capitán',h:'Delegás en el líder para ordenar al grupo.',e:{morale:2,def:.004}}]}}
function renderLiveDecision(){let l=S.live,s=l.scenario,cls=s.kind==='keyplay'?'keyplay':s.kind==='rare'?'rare':'';openModal(`<div class="liveHead"><div class="row between"><span class="minute">${l.minute}' · DECISIÓN ${l.stopIndex+1}/3</span><span class="pill ${s.kind==='rare'?'bad':s.kind==='keyplay'?'warn':''}">${s.kind==='rare'?'EVENTO':s.kind==='keyplay'?'JUGADA CLAVE':'TÁCTICA'}</span></div><div class="liveScore">${l.gh} – ${l.ga}</div><div class="muted small">${club(l.home).name} · ${club(l.away).name}</div></div><h2>${s.t}</h2><p>${s.d}</p>${s.o.map((o,i)=>`<button class="choice ${cls}" onclick="resolveMatchChoice(${i})"><b>${o.t}</b><span>${o.h}</span></button>`).join('')}<div class="small muted center">La decisión cambia probabilidades; nunca garantiza el resultado.</div>`)}
function resolveMatchChoice(i){let l=S.live,s=l.scenario,o=s.o[i],feedback='',impact={type:'info',icon:'🧠',title:'Decisión aplicada',effects:[],duration:2400};if(s.kind==='tactical'||(s.kind==='rare'&&o.e)){let e=o.e||{};l.userAttack+=e.att||0;l.userDefense+=e.def||0;l.fatigue+=e.fat||0;l.moraleMod+=e.morale||0;feedback=o.h;impact.type=(e.morale||0)<0?'warn':(e.morale||0)>0?'success':'info';impact.icon=s.kind==='rare'?'⚠️':'🧠';impact.title=o.t;let fx=[];if(e.morale)fx.push(`Ánimo ${signed(e.morale)}`);if(e.fat)fx.push(`Fatiga +${e.fat}`);impact.effects=fx}else if(s.key==='penalty'){let keeper=pick(['L','C','R']),p=S.roster.find(x=>x.id===s.playerId),chance=.72+(p.ovr-70)*.004-l.fatigue*.008-(o.side===keeper ? .28 : 0);if(Math.random()<chance){teamGoal(S.clubId,l.minute,'penal');feedback=`${p.name} engañó al arquero y convirtió el penal.`;impact={type:'success',icon:'⚽',title:'¡GOL!',effects:['Penal convertido'],duration:3200}}else{feedback=`${p.name} no pudo convertir. El arquero o el palo evitó el gol.`;impact={type:'danger',icon:'❌',title:'PENAL FALLADO',effects:['Sin gol'],duration:3200}}}else if(s.key==='freekick'){let p=S.roster.find(x=>x.id===s.playerId),chance=o.play==='shot' ? .11+(p.ovr-65)*.004 : o.play==='cross' ? .16 : o.play==='set' ? .13 : 0;if(Math.random()<chance){teamGoal(S.clubId,l.minute,'tiro libre');feedback=o.play==='shot'?`${p.name} le pegó directo y la clavó. La pelota parada terminó en gol.`:'La jugada de pelota parada terminó en la red.';impact={type:'success',icon:'⚽',title:'¡GOL!',effects:['Tiro libre convertido'],duration:3200}}else{feedback=o.play==='shot'?`${p.name} buscó el arco, pero la pelota se fue afuera o fue contenida.`:'La jugada no terminó en gol.';impact={type:'warn',icon:o.play==='shot'?'↗️':'🧱',title:o.play==='shot'?'AFUERA':'SIN GOL',effects:[],duration:3000}}if(o.play==='set')l.userAttack+=.005}else if(s.key==='corner'){let chance=o.play==='far' ? .16 : o.play==='near' ? .14 : .08;if(Math.random()<chance){teamGoal(S.clubId,l.minute,'córner');feedback='La ejecución del córner encontró un remate y terminó en la red.';impact={type:'success',icon:'⚽',title:'¡GOL!',effects:['Gol de córner'],duration:3200}}else{feedback='El rival defendió la pelota parada y despejó el peligro.';impact={type:'warn',icon:'🧱',title:'DESPEJÓ EL RIVAL',effects:[],duration:2800};if(o.play==='short')l.userAttack+=.004}}else if(s.key==='injury'){let p=S.roster.find(x=>x.id===s.playerId);if(o.action==='sub'){p.injuredWeeks=Math.max(p.injuredWeeks,1);l.userAttack-=.006;feedback=`${p.name} salió a tiempo. La molestia requiere recuperación.`;impact={type:'warn',icon:'🩹',title:'LO SACASTE A TIEMPO',effects:['Baja: 1 semana'],duration:3200}}if(o.action==='risk'){if(Math.random()<.42){p.injuredWeeks=ri(3,6);l.userAttack-=.012;feedback=`${p.name} siguió jugando y la lesión empeoró por la carga.`;impact={type:'danger',icon:'🚑',title:'¡SE ROMPIÓ!',effects:[`Baja: ${p.injuredWeeks} semanas`],duration:3600}}else{feedback=`${p.name} aguantó y pudo continuar sin agravar la molestia.`;impact={type:'success',icon:'💪',title:'AGUANTÓ',effects:['Sin lesión grave'],duration:2800}}}if(o.action==='slow'){l.userAttack-=.006;l.userDefense+=.003;feedback=`Bajaste la intensidad y protegiste a ${p.name}.`;impact={type:'warn',icon:'🛡️',title:'LO PROTEGISTE',effects:['Menor intensidad'],duration:2700}}}impact.text=feedback;l.decisions.push({m:l.minute,title:s.t,choice:o.t,feedback});l.events.push({m:l.minute,type:'decision',txt:`🧠 ${o.t}`});l.stopIndex++;l.scenario=null;save();showConsequence({...impact,onDone:runNextStop})}
function finishRegulation(){let l=S.live;if(l.mode==='cup'&&l.gh===l.ga)return renderExtraTime();finishLiveMatch()}
function renderExtraTime(){let l=S.live;openModal(`<div class="eyebrow">🏆 PRÓRROGA</div><h2>Empate tras 90 minutos</h2><p>El partido está ${l.gh}-${l.ga}. Tenés una decisión extra exclusiva de Copa.</p><button class="choice" onclick="resolveExtra('attack')"><b>Ir a buscarlo</b><span>Más ataque, pero la fatiga puede dejar espacios.</span></button><button class="choice" onclick="resolveExtra('balanced')"><b>Seguir equilibrado</b><span>No cambiás demasiado el plan.</span></button><button class="choice" onclick="resolveExtra('pens')"><b>Pensar en los penales</b><span>Protegés el empate y cuidás a los mejores pateadores.</span></button>`)}
function resolveExtra(type){let l=S.live,choice=type==='attack'?'Ir a buscarlo':type==='pens'?'Pensar en penales':'Seguir equilibrado';if(type==='attack'){l.userAttack+=.022;l.userDefense-=.01;l.fatigue+=2}if(type==='pens'){l.userDefense+=.02;l.userAttack-=.012}l.decisions.push({m:90,title:'Prórroga',choice,feedback:'Decisión de Copa'});save();showConsequence({type:type==='attack'?'warn':'info',icon:type==='attack'?'🔥':type==='pens'?'🥅':'🧠',title:choice,text:type==='attack'?'El equipo va a asumir más riesgos para buscar el partido.':type==='pens'?'Cerrás espacios y cuidás a los mejores pateadores.':'Mantenés el equilibrio durante la prórroga.',effects:type==='attack'?['Ataque ↑','Fatiga ↑']:type==='pens'?['Defensa ↑','Ataque ↓']:[],duration:2600,onDone:()=>{simulateSegment(120);if(l.gh===l.ga)renderShootoutSelection();else finishLiveMatch()}})}
function renderShootoutSelection(){let l=S.live,cands=[...bestXI()].filter(p=>p.pos!=='ARQ').sort((a,b)=>b.ovr-a.ovr).slice(0,9),sel=l.shootoutTakers||[];openModal(`<div class="eyebrow">⚽ TANDA DE PENALES</div><h2>Elegí 5 pateadores</h2><p>El orden que marques será el orden de ejecución. Seleccionados: ${sel.length}/5.</p>${cands.map(p=>`<button class="choice ${sel.includes(p.id)?'selected':''}" onclick="toggleShooter('${p.id}')" ${!sel.includes(p.id)&&sel.length>=5?'disabled':''}><b>${sel.includes(p.id)?`${sel.indexOf(p.id)+1}. `:''}${p.name}</b><span>${p.pos} · Media ${p.ovr} · ${p.trait}</span></button>`).join('')}<button class="primary" onclick="runShootout()" ${sel.length!==5?'disabled':''}>Comenzar tanda</button>`)}
function toggleShooter(id){let a=S.live.shootoutTakers,i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<5)a.push(id);save();renderShootoutSelection()}
function runShootout(){let l=S.live,us=0,them=0,detail=[];for(let i=0;i<5;i++){let p=S.roster.find(x=>x.id===l.shootoutTakers[i]),pc=.68+(p.ovr-65)*.005+(p.trait==='Valiente' ? .04 : 0);let ug=Math.random()<clamp(pc,.55,.9),og=Math.random()<.72;if(ug)us++;if(og)them++;detail.push(`${i+1}º ${p.name}: ${ug?'gol':'falló'}`)}while(us===them){if(Math.random()<.72)us++;if(Math.random()<.72)them++}l.pens={us,them,won:us>them,detail};closeModal();finishLiveMatch()}
function applyPlayerMatchStats(result){let l=S.live,xi=bestXI();xi.forEach(p=>{p.stats.apps++;p.stats.starts++;let rating=6.2+(result==='W' ? .5 : result==='L' ? -.35 : 0)+(Math.random()-.5)*1.2;p.stats.ratingSum+=clamp(rating,4.5,9.5)});l.events.filter(e=>e.type==='goal'&&e.teamId===S.clubId&&e.playerId).forEach(e=>{let p=S.roster.find(x=>x.id===e.playerId);if(p)p.stats.goals++})}
function finishLiveMatch(){let l=S.live;if(l.mode==='league')simulateRoundAI(S.week-1,false);if(l.mode==='league')updateTable(l.home,l.away,l.gh,l.ga);let us=scoreForUser(l),them=scoreAgainst(l),result;if(l.mode==='cup'&&l.pens)result=l.pens.won?'W':'L';else result=us>them?'W':us<them?'L':'D';let oldConf=S.confidence,oldRep=S.reputation,opp=club(l.opponent),me=club(S.clubId),difficulty=(opp.r-me.r)/5,cDelta=result==='W'?Math.round(4+difficulty):result==='D'?Math.round(1+difficulty*.4):Math.round(-4+difficulty*.5),rDelta=result==='W'?Math.max(1,Math.round(2+difficulty)):result==='D'?Math.round(difficulty>0?1:0):Math.min(-1,Math.round(-1+difficulty*.3));if(l.mode==='cup'){cDelta+=result==='W'?2:-2;if(result==='W'&&opp.r>=me.r+8)rDelta+=4}S.confidence=clamp(S.confidence+cDelta,0,100);S.reputation=clamp(S.reputation+rDelta,0,100);S.morale=clamp(S.morale+(result==='W'?4:result==='D'?0:-4)+(l.moraleMod||0),25,100);applyPlayerMatchStats(result);if(l.mode==='league'){if(result==='W'){S.stint.w++;S.career.wins++;S.winStreak=(S.winStreak||0)+1}else if(result==='D'){S.stint.d++;S.career.draws++;S.winStreak=0}else{S.stint.l++;S.career.losses++;S.winStreak=0}S.earned+=Math.round(S.contract.salary/4)}else{let round=CUP_ROUNDS[S.cup.roundIndex],outcome=result==='W'?'Clasificaste':'Eliminado';S.cup.history.push({round,opp:l.opponent,us,them,outcome,pens:!!l.pens});if(result==='W'){if(S.cup.roundIndex===CUP_ROUNDS.length-1){S.cup.champion=true;S.cup.alive=false;S.career.cups++;S.career.titles++;S.reputation=clamp(S.reputation+10,0,100);S.career.memorable.push({title:'Campeón de Copa',text:`Ganaste la Copa Interdivisional con ${club(S.clubId).name} en la temporada ${S.season}.`})}else{S.cup.roundIndex++;S.cup.nextWeek=CUP_WEEKS[S.cup.roundIndex];S.cup.opponentId=null}}else S.cup.alive=false;if(Math.abs(opp.r-me.r)>=10&&result==='W')S.career.memorable.push({title:'Batacazo en Copa',text:`${club(S.clubId).name} eliminó a ${opp.name} (${opp.r}) en ${round}.`})}let feedback=l.decisions.map(d=>`${d.title}: ${d.choice}`).slice(0,4);S.lastMatch={mode:l.mode,round:l.mode==='cup'?CUP_ROUNDS[Math.max(0,S.cup.roundIndex-(result==='W'?1:0))]:null,f:{home:l.home,away:l.away,opponent:l.opponent,isHome:l.isHome},gh:l.gh,ga:l.ga,us,them,result,pens:l.pens,confDelta:S.confidence-oldConf,repDelta:S.reputation-oldRep,pos:l.mode==='league'?tablePos():null,events:l.events,decisions:l.decisions,feedback};S.live=null;S.phase=l.mode==='cup'?'postCup':'postLeague';if(l.mode==='league')maybeJobOffer();if(S.confidence<=20&&S.week>=5&&l.mode==='league'){S.phase='fired';S.career.firings++;archiveStint('Despido')}save();render();renderMatchResult()}
function renderMatchResult(){let m=S.lastMatch,f=m.f,pen=m.pens?` <span class="small muted">(pen. ${m.pens.us}-${m.pens.them})</span>`:'';openModal(`<div class="eyebrow">${m.mode==='cup'?'🏆 COPA NACIONAL':`LIGA · FECHA ${S.week}`}</div><div class="scoreBox"><div class="scoreNames"><span>${club(f.home).name}</span><span>${club(f.away).name}</span></div><div class="score">${m.gh} – ${m.ga}</div>${pen}<div style="margin-top:8px"><span class="pill ${m.result==='W'?'good':m.result==='L'?'bad':'warn'}">${m.result==='W'?'Victoria':m.result==='L'?'Derrota':'Empate'}</span></div></div><div class="timeline">${m.events.filter(e=>e.type!=='decision').slice(-12).map(e=>`<div class="event"><time>${e.m}'</time><div class="txt">${e.txt}</div></div>`).join('')||'<div class="muted small center">Sin incidencias destacadas.</div>'}</div><div class="divider"></div><div class="sectionTitle">Tus decisiones</div>${m.decisions.map(d=>`<div class="decisionLog"><b>${d.m}' · ${d.choice}</b><br>${d.feedback||''}</div>`).join('')}<div class="grid2" style="margin-top:10px"><div class="metric"><small>Directiva</small><b>${signed(m.confDelta)}</b></div><div class="metric"><small>Reputación</small><b>${signed(m.repDelta)}</b></div></div><div style="height:10px"></div><button class="primary" onclick="closeModal();renderPost()">Ver consecuencias</button>`)}
function renderPost(){let m=S.lastMatch;if(!m)return;let title=m.mode==='cup'?(m.result==='W'?'Seguís en la Copa':'Fin del camino en Copa'):(m.result==='W'?'Trabajo cumplido':m.result==='L'?'La presión aumenta':'Punto sumado');openModal(`<div class="eyebrow">POST PARTIDO</div><h2>${title}</h2><p>${m.mode==='league'?`Quedaste ${m.pos}º en ${DIV_NAMES[S.league.div]}.`:m.result==='W'?(S.cup.champion?'¡Sos campeón de la Copa Interdivisional!':`Avanzaste a ${CUP_ROUNDS[S.cup.roundIndex]}.`):'La Copa continúa sin tu equipo.'}</p><div class="grid2"><div class="metric"><small>Confianza</small><b>${S.confidence}</b></div><div class="metric"><small>Reputación</small><b>${S.reputation}</b></div></div>${S.pendingJobOffer?`<div class="notice" style="margin-top:12px"><b>Hay interés de otro club.</b> Tu rendimiento empezó a llamar la atención.</div>`:''}<div style="height:12px"></div><button class="primary" onclick="finishPost()">${m.mode==='cup'?'Volver a la agenda':'Continuar a la siguiente fecha'}</button>`)}
function finishPost(){closeModal();if(S.lastMatch?.mode==='cup'){S.weekFlow.cupDone=true;S.phase='weekStart';save();advanceWeekFlow();return}S.week++;S.weekFlow=null;S.activeTask=null;S.phase=S.week>18?'seasonEnd':'weekStart';save();render()}
function maybeJobOffer(){if((S.winStreak||0)<3||Math.random()>.22||S.pendingJobOffer)return;let cur=club(S.clubId),pool=CLUBS.filter(c=>prestige(c)>prestige(cur)+10&&(S.worldDivs?.[c.id]||c.div)<=S.league.div);if(!pool.length)return;pool.sort((a,b)=>prestige(a)-prestige(b));S.pendingJobOffer=makeContract(pick(pool.slice(0,Math.min(5,pool.length))),5)}
function showBetterOffer(){let ct=S.pendingJobOffer,c=club(ct.clubId);openModal(`<div class="eyebrow">OFERTA DE TRABAJO</div><div class="contractHeader">${shield(c,'sm')}<div><h2 style="margin:0">${c.name}</h2><div class="muted small">${DIV_NAMES[S.worldDivs?.[c.id]||c.div]} · Prestigio superior</div></div></div><p>El club quiere que asumas de inmediato.</p><div class="objective"><b>Liga:</b> ${ct.objective.text}<br><b>Copa:</b> ${ct.cupObjective.text}</div><button class="primary" onclick='acceptBetter(${JSON.stringify(ct)})'>Aceptar y cambiar de club</button><div style="height:8px"></div><button class="secondary" onclick="rejectBetter()">Rechazar</button>`)}
function acceptBetter(ct){archiveStint('Cambio de club');let oldWeek=S.week;S.clubId=ct.clubId;S.contract=ct;S.confidence=ct.confidence;S.roster=makeRoster(club(ct.clubId));S.academy=makeAcademy(club(ct.clubId),S.season);S.stint={clubId:ct.clubId,startSeason:S.season,startWeek:S.week,w:0,d:0,l:0};S.winStreak=0;S.pendingJobOffer=null;S.weekFlow=null;S.phase='weekStart';initLeague(S.worldDivs?.[ct.clubId]||club(ct.clubId).div,Math.max(0,oldWeek-1));S.cup=setupCupFor(ct.clubId,S.season,S.worldDivs);save();closeModal();render();toast('Nuevo contrato firmado.')}
function rejectBetter(){S.reputation=clamp(S.reputation+1,0,100);S.pendingJobOffer=null;save();closeModal();render();toast('Oferta rechazada.')}
function archiveStint(reason){if(!S?.stint)return;S.career.clubs.push({clubId:S.stint.clubId,startSeason:S.stint.startSeason,startWeek:S.stint.startWeek,endSeason:S.season,endWeek:S.week,w:S.stint.w,d:S.stint.d,l:S.stint.l,reason})}
function firedOffers(){let cur=club(S.clubId),curP=prestige(cur),pool=CLUBS.filter(c=>c.id!==cur.id&&prestige(c)<curP-1).sort((a,b)=>prestige(b)-prestige(a)),band=pool.slice(0,Math.max(6,Math.min(pool.length,12))),chosen=shuffle(band).slice(0,3);if(chosen.length<3)chosen=CLUBS.filter(c=>c.id!==cur.id).sort((a,b)=>prestige(a)-prestige(b)).slice(0,3);return chosen.map(c=>makeContract(c,-4))}

function makeKeyPlay(idx){let l=S.live,minute=l.minute,roster=bestXI(),taker=roster.filter(p=>['DC','MCO','MC','EI','ED'].includes(p.pos)).sort((a,b)=>(b.ovr+playerCareerMetrics(b).decision*.08)-(a.ovr+playerCareerMetrics(a).decision*.08))[0]||roster[0],types=['freekick','corner','counter','oneonone'];if(Math.random()<.14)types.push('penalty');let type=pick(types);if(type==='penalty')return {kind:'keyplay',key:'penalty',playerId:taker.id,t:'¡Penal para tu equipo!',d:`${minute}' · ${taker.name} acomoda la pelota. Temple ${playerCareerMetrics(taker).composure}.`,o:[{t:'Cruzarla a la izquierda',h:'Remate colocado al palo.',side:'L'},{t:'Esperar y patear al medio',h:'Busca que el arquero se juegue.',side:'C'},{t:'Abrir el pie a la derecha',h:'Remate al otro costado.',side:'R'}]};if(type==='freekick')return {kind:'keyplay',key:'freekick',playerId:taker.id,t:'Tiro libre peligroso',d:`${minute}' · Falta a unos 24 metros. ${taker.name} está sobre la pelota.`,o:[{t:'Pegarle directo',h:'Busca el arco.',play:'shot'},{t:'Centro al segundo palo',h:'Buscás un cabezazo.',play:'cross'},{t:'Tocar corto y rematar',h:'Intentás mover la barrera.',play:'set'}]};if(type==='corner')return {kind:'keyplay',key:'corner',playerId:taker.id,t:'Córner a favor',d:`${minute}' · El rival defiende muy metido en su área.`,o:[{t:'Primer palo',h:'Movimiento corto y agresivo.',play:'near'},{t:'Segundo palo',h:'Buscás a los jugadores altos.',play:'far'},{t:'Jugar corto',h:'Conservás la pelota y cambiás el ángulo.',play:'short'}]};if(type==='counter')return {kind:'keyplay',key:'counter',playerId:taker.id,t:'Contraataque: quedás 3 contra 2',d:`${minute}' · ${taker.name} conduce con dos compañeros acompañando.`,o:[{t:'Filtrar el pase al medio',h:'Buscás dejar a un compañero de frente.',play:'through'},{t:'Abrirla al extremo',h:'Atacás al defensor por afuera.',play:'wide'},{t:'Rematar antes de que vuelvan',h:'Finalizás rápido la contra.',play:'early'}]};return {kind:'keyplay',key:'oneonone',playerId:taker.id function makeRareEvent(idx){let l=S.live,minute=l.minute;if(Math.random()<.62){let p=pick(bestXI()),m=playerCareerMetrics(p);return {kind:'rare',key:'injury',playerId:p.id,t:`${p.name} se toca la parte posterior de la pierna`,d:`${minute}' · El médico dice que puede seguir, pero su resistencia física es ${m.injuryResilience}/100.`,o:[{t:'Cambiarlo de inmediato',h:'Evitás cargar una molestia.',action:'sub'},{t:'Dejarlo seguir',h:'Conservás al jugador con riesgo real de agravar.',action:'risk'},{t:'Bajarle el ritmo',h:'Sigue, pero con menos recorridos.',action:'slow'}]}}let p=pick(bestXI().filter(x=>x.pos!=='ARQ'));return {kind:'rare',key:'hard_duel',playerId:p.id,t:`${p.name} está entrando tarde a los cruces`,d:`${minute}' · Ya tuvo dos faltas fuertes y el árbitro le marca el límite.`,o:[{t:'Pedirle que mida las entradas',h:'Baja el riesgo de tarjeta, cede algo de agresividad.',e:{def:.007,att:-.002},set:'calmDuels'},{t:'Darle cobertura',h:'Otro jugador lo ayuda en ese sector.',e:{def:.012,fat:1},set:'coverBooked'},{t:'Que siga fuerte',h:'Mantenés intensidad con riesgo disciplinario.',e:{def:.008,att:.004},set:'aggressiveBooked'}]}}
function liveContextHtml(l){let us=scoreForUser(l),them=scoreAgainst(l),flow=l.flow||{},items=[];items.push(`<span>${l.minute}'</span>`);items.push(`<span class="${us>them?'safe':us<them?'hot':''}">${us>them?'Ganando':us<them?'Perdiendo':'Empate'} ${us}-${them}</span>`);if(flow.userThreat>flow.oppThreat+1)items.push('<span class="safe">Tu equipo empuja</span>');else if(flow.oppThreat>flow.userThreat+1)items.push('<span class="hot">Rival presionando</span>');if(l.fatigue>=3)items.push('<span class="hot">Fatiga alta</span>');return `<div class="liveContext">${items.join('')}</div>`}
function renderLiveDecision(){let l=S.live,s=l.scenario,cls=s.kind==='keyplay'?'keyplay':s.kind==='rare'?'rare':'',total=l.stops.length;openModal(`<div class="liveHead"><div class="row between"><span class="minute">${l.minute}' · INTERVENCIÓN ${Math.min(l.stopIndex+1,total)}/${total}</span><span class="pill ${s.kind==='rare'?'bad':s.kind==='keyplay'?'warn':''}">${s.kind==='rare'?'EN CANCHA':s.kind==='keyplay'?'JUGADA CLAVE':'LECTURA DEL PARTIDO'}</span></div><div class="liveScore">${l.gh} – ${l.ga}</div><div class="muted small">${club(l.home).name} · ${club(l.away).name}</div></div>${liveContextHtml(l)}<h2>${s.t}</h2><p>${s.d}</p>${s.o.map((o,i)=>`<button class="choice ${cls}" onclick="resolveMatchChoice(${i})"><b>${o.t}</b><span>${o.h}</span></button>`).join('')}<div class="small muted center">La situación nace de lo que está ocurriendo en este partido.</div>`)}
function applyContextChoice(l,o){if(!o.set)return;if(o.set==='fullbacksHigh')l.context.fullbacksHigh=true;if(['lowBlock','coverFlanks'].includes(o.set))l.context.fullbacksHigh=false;if(o.set==='lowBlock')l.context.lowBlock=true;else if(['pressHigh','controlledAttack','fullbacksHigh'].includes(o.set))l.context.lowBlock=false;if(o.set==='pressHigh')l.context.pressHigh=true;else if(['manageEnergy','possession','lowBlock'].includes(o.set))l.context.pressHigh=false;l.context.lastChoice=o.set}
function pressureChance(p,base=.62){let m=playerCareerMetrics(p),stage=careerStage(p),ageBonus=stage==='Veterano'?.035:stage==='Juvenil'?-.015:0;return clamp(base+(m.composure-65)*.0022+(m.decision-65)*.0015+ageBonus-S.live.fatigue*.006,.38,.92)}
function resolveMatchChoice(i){let l=S.live,s=l.scenario,o=s.o[i],feedback='',impact={type:'info',icon:'🧠',title:'Decisión aplicada',effects:[],duration:2300};if(s.kind==='tactical'||(s.kind==='rare'&&o.e)){let e=o.e||{};l.userAttack+=e.att||0;l.userDefense+=e.def||0;l.fatigue=Math.max(0,l.fatigue+(e.fat||0));l.moraleMod+=e.morale||0;applyContextChoice(l,o);feedback=o.h;impact.type=(e.morale||0)<0?'warn':(e.def||0)+(e.att||0)>.018?'success':'info';impact.icon=s.kind==='rare'?'⚠️':'🧠';impact.title=o.t;let fx=[];if(e.fat)fx.push(e.fat>0?`Fatiga +${e.fat}`:`Fatiga ${e.fat}`);impact.effects=fx}else if(s.key==='penalty'){let keeper=pick(['L','C','R']),p=S.roster.find(x=>x.id===s.playerId),chance=pressureChance(p,.74)-(o.side===keeper?.27:0);if(Math.random()<chance){teamGoal(S.clubId,l.minute,'penal');feedback=`${p.name} engañó al arquero y convirtió.`;impact={type:'success',icon:'⚽',title:'¡GOL!',effects:[`${personalityLabel(p)} · Temple ${playerCareerMetrics(p).composure}`],duration:3000}}else{feedback=`${p.name} no pudo convertir: el arquero leyó la ejecución o el remate salió desviado.`;impact={type:'danger',icon:'❌',title:'PENAL FALLADO',effects:[`Temple ${playerCareerMetrics(p).composure}`],duration:3000}}}else if(s.key==='freekick'){let p=S.roster.find(x=>x.id===s.playerId),m=playerCareerMetrics(p),chance=o.play==='shot'?.10+(p.ovr-65)*.004+(m.decision-65)*.001:o.play==='cross'?.15:o.play==='set'?.13:0;if(Math.random()<chance){teamGoal(S.clubId,l.minute,'tiro libre');feedback=o.play==='shot'?`${p.name} supera la barrera y la mete.`:'La pelota parada termina en un remate de gol.';impact={type:'success',icon:'⚽',title:'¡GOL!',effects:['Pelota parada'],duration:3000}}else{let titles=o.play==='shot'?['AFUERA','ATAJÓ EL ARQUERO']:['DESPEJÓ EL RIVAL','SIN REMATE'];impact={type:'warn',icon:'🧱',title:pick(titles),effects:[],duration:2600};feedback=o.play==='shot'?`${p.name} prueba al arco, pero no termina en gol.`:'La defensa rival resuelve la jugada.'}}else if(s.key==='co ;impact={type:'success',icon:'💪',title:'PUDO SEGUIR',effects:[`Resistencia física ${m.injuryResilience}`],duration:2600}}}if(o.action==='slow'){l.userAttack-=.005;l.userDefense+=.003;l.fatigue=Math.max(0,l.fatigue-.5);feedback=`Le bajás los recorridos a ${p.name} para protegerlo.`;impact={type:'warn',icon:'🛡️',title:'MENOS CARGA',effects:['Menor intensidad'],duration:2500}}}impact.text=feedback;l.decisions.push({m:l.minute,title:s.t,choice:o.t,feedback});l.events.push({m:l.minute,type:'decision',txt:`🧠 ${o.t}`});l.stopIndex++;l.scenario=null;save();let dramatic=s.kind==='keyplay'||s.key==='injury';if(dramatic)showConsequence({...impact,onDone:runNextStop});else{closeModal();toast(feedback||o.t);setTimeout(runNextStop,420)}}
function runShootout(){let l=S.live,us=0,them=0,detail=[];for(let i=0;i<5;i++){let p=S.roster.find(x=>x.id===l.shootoutTakers[i]),m=playerCareerMetrics(p),pc=.65+(p.ovr-65)*.004+(m.composure-65)*.002+(m.experience-60)*.0012;let ug=Math.random()<clamp(pc,.5,.91),og=Math.random()<.72;if(ug)us++;if(og)them++;detail.push(`${i+1}º ${p.name}: ${ug?'gol':'falló'}`)}while(us===them){if(Math.random()<.72)us++;if(Math.random()<.72)them++}l.pens={us,them,won:us>them,detail};closeModal();finishLiveMatch()}

function recentMatchScenario(key,n=12){S.matchScenarioHistory??=[];return S.matchScenarioHistory.slice(-n).includes(key)}

function makeGeneralDecision(){

 let fresh=pool.filter(x=>!recentDecisionKey(x.key));let base=pick(fresh.length?fresh:pool);rememberDecision(base.key);
 let ro=S.roster.filter(p=>!p.injuredWeeks),pickPlayer=(arr=ro)=>arr.length?pick(arr):null;
 if(base.t==='Pedido de titularidad'){let starters=new Set(ensureLineup()),cand=ro.filter(p=>!starters.has(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,8),p=pickPlayer(cand);if(p){base.playerId=p.id;base.t=`Pedido de titularidad · ${p.name}`;base.d=`${p.name} (${p.pos}, ${p.ovr} OVR, ${p.age} años) siente que está haciendo méritos y te pide una oportunidad. ${profileSummary(p)}.`}}
 else if(base.t==='Oferta por una figura'){let p=pickPlayer([...ro].sort((a,b)=>b.ovr-a.ovr).slice(0,5)),buyers=CLUBS.filter(c=>c.id!==S.clubId&&c.r>=club(S.clubId).r).sort((a,b)=>b.r-a.r).slice(0,10),buyer=pick(buyers.length?buyers:CLUBS.filter(c=>c.id!==S.clubId));if(p){base.playerId=p.id;base.offerClubId=buyer.id;base.offerAmount=+(Math.max(.3,p.value*(1.1+Math.random()*.45))).toFixed(2);base.t=`Oferta por ${p.name}`;base.d=`${buyer.name} consultó por ${p.name}. ${p.pos} · ${p.ovr} OVR · ${p.age} años · valor estimado ${money(p.value)}. El sondeo ronda ${money(base.offerAmount)}.`}}

function startWeek(){
 if(S.week>18){S.phase='seasonEnd';save();render();return}
 if(!S.weekFlow||S.weekFlow.week!==S.week){
  progressWeekStatuses();let tasks=[],report=maybeGenerateReport(),m=maybeGenerateMessage();
  if(report&&Math.random()<.78)tasks.push({type:'report',data:report});
  if(m?.important)tasks.push({type:'message',id:m.id});
  if(S.week%4===0&&S.academy?.length&&Math.random()<.55){let y=pick(S.academy);tasks.push({type:'academy',id:y.id})}
  let eventChance=S.week===1?.25:.26;if(Math.random()<eventChance)tasks.push({type:'decision',data:makeGeneralDecision()});
  if(tasks.length>2)tasks=shuffle(tasks).slice(0,2);else tasks=shuffle(tasks);
  S.weekFlow={week:S.week,tasks,cupDone:false};S.activeTask=null
 }
 advanceWeekFlow()
}

function buildMatchStops(mode,f){
 let diff=Math.abs(club(f.home).r-club(f.away).r),count=mode==='cup'?2:ri(0,2);
 if(diff<=4&&Math.random()<.65)count++;
 if(Math.random()<.28)count++;
 if(diff>=13&&Math.random()<.65)count--;
 if(mode==='cup')count=Math.max(1,count);
 count=clamp(count,0,5);
 if(count===0)return[];
 let patterns={1:[[40,72]],2:[[24,41],[63,82]],3:[[17,30],[43,61],[70,85]],4:[[14,24],[33,46],[56,70],[76,87]],5:[[11,20],[27,38],[44,55],[61,73],[79,88]]};
 return patterns[count].map(([a,b])=>ri(a,b))

 save();let weight=Object.values(e||{}).reduce((a,v)=>a+Math.abs(Number(v)||0),0),major=weight>=10;

function v06EnsurePlayer(p){
 if(!p)return p;ensureCareerProfile(p);p.trainingFocus??='auto';p.trainingLoad??='normal';p.devXP??=0;p.developmentHistory??=[];
 if(!p.skills){let rnd=prng(seedNum(String(p.id||p.name)+'-skills-v06'));let spread=()=>Math.round((rnd()-.5)*13);p.skills={technique:clamp(p.ovr+spread(),35,96),finishing:clamp(p.ovr+spread(),30,96),passing:clamp(p.ovr+spread(),30,96),defending:clamp(p.ovr+spread(),28,96),setPieces:clamp(p.ovr-4+spread(),25,96),positioning:clamp(p.ovr+spread(),30,96)};if(p.pos==='ARQ'){p.skills.finishing=28;p.skills.passing=clamp(p.ovr-5+spread(),30,88);p.skills.defending=clamp(p.ovr+4+spread(),40,96)}}
 if(p.potential==null){let rnd=prng(seedNum(String(p.id||p.name)+'-potential-v06')),a=p.age||24,room=a<=21?riSeed(rnd,5,15):a<=25?riSeed(rnd,2,8):a<=29?riSeed(rnd,0,4):0;p.potential=clamp(p.ovr+room,p.ovr,93)}
 return p
}
function v06RoleMetric(p){v06EnsurePlayer(p);let s=p.skills,m=playerCareerMetrics(p);if(p.pos==='ARQ')return {label:'Arquero',value:Math.round(clamp(p.ovr*.72+m.composure*.18+s.passing*.10,20,98))};if(['DFC','LD','LI','MCD'].includes(p.pos))return {label:'Defensa',value:Math.round((s.defending*.58+s.positioning*.22+p.ovr*.20))};if(['MC','MCO'].includes(p.pos))return {label:'Técnica',value:Math.round((s.technique*.42+s.passing*.38+p.ovr*.20))};return {label:'Ataque',value:Math.round((s.finishing*.46+s.technique*.30+p.ovr*.24))}}
function v06Quick(p){v06EnsurePlayer(p);let m=playerCareerMetrics(p),r=v06RoleMetric(p);return {physical:m.physical,role:r.value,roleLabel:r.label,decision:m.decision,mental:Math.round((m.decision+m.composure+m.experience)/3)}}
function v06Trend(p){let h=p.developmentHistory||[];if(!h.length)return 'Sin cambios registrados';let recent=h.slice(-4),sum=recent.reduce((a,x)=>a+(x.ovrDelta||0),0),skills=recent.reduce((a,x)=>a+(x.skillGain||0),0);return sum>0?`Media +${sum} recientemente`:skills>=2?'Mejora técnica sostenida':'Evolución estable'}
function v06TrainingRecommendation(p){let m=playerCareerMetrics(p),s=p.skills,stage=careerStage(p);if(stage==='Veterano'){if(m.decision<82)return 'decisions';if(m.leadership<82)return 'leadership';return 'technique'}if(stage==='Juvenil'){let vals=[['decisions',m.decision],['physical',m.physical],['technique',s.technique],['passing',s.passing],['finishing',s.finishing],['defending',s.defending]];return vals.sort((a,b)=>a[1]-b[1])[0][0]}let vals=[['decisions',m.decision],['technique',s.technique],['passing',s.passing],['finishing',s.finishing],['defending',s.defending]];return vals.sort((a,b)=>a[1]-b[1])[0][0]}
function v06FocusName(id){return (V06_TRAINING_FOCI.find(x=>x.id===id)||V06_TRAINING_FOCI[0]).name}
function v06SetTraining(id,focus){let p=[...(S.roster||[]),...(S.academy||[])].find(x=>x.id===id);if(!p)return;v06EnsurePlayer(p);p.trainingFocus=focus;save();render();toast(`${p.name}: ${v06FocusName(focus)}.`)}
function v06ApplyWeeklyTraining(){
 let all=[...(S.roster||[]),...(S.academy||[])];for(let p of all){v06EnsurePlayer(p);let stage=careerStage(p),focus=p.trainingFocus==='auto'?v06TrainingRecommendation(p):p.trainingFocus,m=playerCareerMetrics(p),ageFactor=stage==='Juvenil'?1:stage==='Adulto'?.42:.18,professional=(p.profile.professionalism||65)/100,morale=(p.morale??S.morale??70)/100,injured=p.injuredWeeks>0;if(injured)ageFactor*=.18;let gain=(4.2*ageFactor)*(0.72+professional*.35)*(0.75+morale*.3),skillGain=0,before=p.ovr;
  if(focus==='physical'){p.profile.athleticism=clamp(p.profile.athleticism+gain*.18,25,96);p.profile.recovery=clamp(p.profile.recovery+gain*.12,25,96);skillGain=gain*.3}
  else if(focus==='decisions'){p.profile.decisionTalent=clamp(p.profile.decisionTalent+gain*.22,25,97);p.profile.professionalism=clamp(p.profile.professionalism+gain*.06,25,97);skillGain=gain*.28}
  else if(focus==='leadership'){p.profile.leadership=clamp(p.profile.leadership+gain*.20,25,97);p.profile.professionalism=clamp(p.profile.professionalism+gain*.05,25,97);skillGain=gain*.25}
  else {let key=focus==='setpieces'?'setPieces':focus;if(p.skills[key]!=null){p.skills[key]=clamp(p.skills[key]+gain*.22,20,97);skillGain=gain*.22}else{p.skills.technique=clamp(p.skills.technique+gain*.16,20,97);skillGain=gain*.16}}
  let minutesFactor=(p.stats?.starts||0)>=(S.week-1)*.45?1.10:(p.stats?.apps||0)>=(S.week-1)*.35?.92:.78;p.devXP+=gain*minutesFactor*(stage==='Veterano'?.42:1);let threshold=stage==='Juvenil'?78:stage==='Adulto'?155:260;if(p.devXP>=threshold&&p.ovr<p.potential){p.ovr=clamp(p.ovr+1,40,p.potential);p.devXP-=threshold}
  let delta=p.ovr-before;if(delta||skillGain>.65){p.developmentHistory.push({season:S.season,week:S.week,ovr:p.ovr,ovrDelta:delta,focus,skillGain:+skillGain.toFixed(1)});p.developmentHistory=p.developmentHistory.slice(-16)}
 }
}

function v06EnsureMarket(force=false){S.market??={history:[],offers:[],windowKey:null};let key=`${S.season}-${S.week<=4?'A':S.week<=12&&S.week>=9?'B':'X'}`;if(force||S.market.windowKey!==key||!S.market.offers?.length){S.market.windowKey=key;let myDiv=S.worldDivs?.[S.clubId]||club(S.clubId).div,pool=CLUBS.filter(c=>c.id!==S.clubId&&Math.abs((S.worldDivs?.[c.id]||c.div)-myDiv)<=1),offers=[];for(let c of shuffle(pool).slice(0,10)){for(let p of makeRoster(c).sort((a,b)=>b.ovr-a.ovr).slice(0,2)){v06EnsurePlayer(p);p.sourceClubId=c.id;p.asking=+(Math.max(.05,p.value*(1.05+Math.random()*.28))).toFixed(2);offers.push(p)}}S.market.offers=shuffle(offers).slice(0,14)}S.budget??=club(S.clubId).budget;return S.market}
function v06BuyPlayer(id){v06EnsureMarket();if(!v06MarketOpen())return toast('El mercado está cerrado.');if(S.roster.length>=32)return toast('Plantel completo: máximo 32.');let p=S.market.offers.find(x=>x.id===id);if(!p)return;let price=p.asking||p.value;if(S.budget<price)return toast('No alcanza el presupuesto.');S.budget=+(S.budget-price).toFixed(2);let cp=JSON.parse(JSON.stringify(p));delete cp.asking;delete cp.sourceClubId;normalizePlayer(cp);v06EnsurePlayer(cp);S.roster.push(cp);S.market.offers=S.market.offers.filter(x=>x.id!==id);S.market.history.push({season:S.season,week:S.week,type:'buy',player:cp.name,amount:price,clubId:p.sourceClubId});ensureLineup();save();render();showConsequence({type:'success',icon:'✍️',title:'FICHAJE CERRADO',text:`${cp.name} se incorpora a ${club(S.clubId).name}.`,effects:[money(price),`${cp.ovr} OVR · ${careerStage(cp)}`],duration:2800})}

  p.age++;p.developmentHistory??=[];p.developmentHistory.push({season,week:19,ovr:p.ovr,ovrDelta:p.ovr-before,focus:'fin de temporada',skillGain:Math.max(0,gain)});p.developmentHistory=p.developmentHistory.slice(-20);p.v075SeasonAppsBase=p.stats?.apps||0;p.v075SeasonStartsBase=p.stats?.starts||0;p.v075SeasonRatingBase=p.stats?.ratingSum||0

  function opponentMidfield(l,c){

        choice('Que el lateral espere','No salís de zona y protegés la espalda.',{e:{def:.010},end:'reform'}),
        choice('Mandar una ayuda del volante','Cerrás el dos contra uno sin romper el centro.',{e:{def:.012,fat:1},end:'reform'})
      ]},c,'em807_wide_progress')}}

  function opponentDefensive(l,c){
    const m=l.minute;
    const items=[];
    if(c.depth==='box')items.push({k:'box_emergency',f:()=>{chain('em807_box_def');return mark({kind:'seq79',stage:2,t:'El rival entra en tu área',d:`${m}' · La pelota ya está en zona de definición. La emergencia es real.`,o:[
      choice('Salir al cruce','Buscás bloquear antes del remate.',{mini:'tackle',ok:'safe',fail:'keeper'}),

    ]},c,'em807_box_emergency')}});
    if(c.side!=='center')items.push({k:'cross_danger',f:()=>{chain('em807_cross_def');return mark({kind:'seq79',stage:2,t:'El rival llega por afuera cerca de tu área',d:`${m}' · Está en posición de centro y tus defensores retroceden hacia el área.`,o:[
      choice('Salir a bloquear el centro','El lateral intenta cortar antes del envío.',{mini:'tackle',ok:'safe',fail:'keeper'}),
      choice('Cerrar el área y conceder la banda','Priorizás las zonas de remate.',{end:'reform'}),
      choice('Presionar al portador','Buscás que no pueda levantar la cabeza.',{mini:'press',ok:'safe',fail:'counterdef'})
    ]},c,'em807_cross_danger')}});
    items.push(
      {k:'approach',f:()=>{chain('em807_defend');return mark({kind:'seq79',stage:1,t:'El rival progresa hacia tu área',d:`${m}' · La pelota está en tu tercio defensivo y todavía podés frenar la jugada antes del remate.`,o:[
        choice('Cortar antes de que entre al área','Elegí el momento del cruce.',{mini:'tackle',ok:'safe',fail:'keeper'}),
        choice('Replegar y cerrar el centro','Cedés metros para recuperar la forma.',{e:{def:.012,att:-.004},end:'reform'}),
        choice('Presionar al portador','Buscás recuperar; si te supera, aumenta el peligro.',{mini:'press',ok:'safe',fail:'keeper'})
      ]},c,'em807_defend')}},
      {k:'runner',f:()=>{chain('em807_runner');return mark({kind:'seq79',stage:2,t:'Un rival ataca el espacio delante de tus centrales',d:`${m}' · La jugada ya entra en tu tercio y una mala lectura puede dejarlo de cara al arco.`,o:[
        choice('Anticipar el pase','Buscás cortar la jugada antes de que reciba.',{mini:'tackle',ok:'safe',fail:'keeper'}),
        choice('Acompañar la carrera','Retrocedés manteniendo al atacante delante tuyo.',{end:'reform'}),
        choice('Presionar al pasador','Intentás que no pueda filtrar limpio.',{mini:'press',ok:'safe',fail:'counterdef'})
      ]},c,'em807_runner')}}
    );
    return pickFresh(l,c,items)
  }

  function build807(idx,l=S.live){
    if(!l)return null;
    const c=context(l);
    if(!c)return typeof em806BuildScenario==='function'?em806BuildScenario(idx,l):null;

    // Primero conserva córners reales y situaciones personales ya detectadas por v0.8.6.
    let base=null;
    try{base=typeof em806BuildScenario==='function'?em806BuildScenario(idx,l):null}catch(e){}
    if(base&&['em806_corner','em806_corner_against','booked_defender','target_booked','tired_mid'].includes(base.key))return base;

    // Reincorpora eventos humanos ocasionales sin alterar la posición de la pelota.
    if(Math.random()<.10&&typeof makeRareEvent==='function'){
      try{
        let rare=makeRareEvent(idx);
        if(rare?.t&&Array.isArray(rare.o))return Object.assign(rare,{em806ZoneKey:c.key,em807:true})
      }catch(e){}
    }

    const tactical=tacticalContext(l,c);if(tactical)return tactical;
    if(c.poss==='us')return c.zone==='defensive'?userDefensive(l,c):c.zone==='midfield'?userMidfield(l,c):userAttacking(l,c);
    return c.zone==='defensive'?opponentDefensive(l,c):c.zone==='midfield'?opponentMidfield(l,c):opponentBuild(l,c)
  }

  // Todos los caminos de pausa usan la nueva selección variada, no solo makeMatchScenario.
  makeMatchScenario=function(idx){return build807(idx,S.live)};
  em80PauseForDecision=function(l=S.live){
    if(!l)return;
    try{if(typeof em80Stop==='function')em80Stop();l.scenario=build807(l.stopIndex,l);save();renderLiveDecision()}
    catch(e){console.error('em807 decision bridge',e);try{l.scenario=typeof em806BuildScenario==='function'?em806BuildScenario(l.stopIndex,l):null;save();renderLiveDecision()}catch(x){console.error('em807 fallback',x)}}
  };
  em80EmergencyDecision=function(l=S.live){if(!l)return;try{l.scenario=build807(l.stopIndex,l);save();renderLiveDecision()}catch(e){console.error('em807 emergency',e)}};

  // Resultado final: un callback tardío de un minijuego o animación nunca puede taparlo.
  const finishBase=finishLiveMatch;
  const resultBase=renderMatchResult;
  const postBase=renderPost;
  const finishPostBase=finishPost;
  const runBase=runNextStop;
  const renderBase=render;

  finishLiveMatch=function(){
    if(!S.live){if(S.em807ResultPending&&S.lastMatch)return resultBase();return}
    S.em807ResultPending=true;
    try{save()}catch(e){}
    const r=finishBase();
    if(S.lastMatch&&!S.live){S.em807ResultPending=true;try{save()}catch(e){};resultBase()}
    return r
  };
  renderMatchResult=function(){
    if(S.lastMatch&&!S.live){S.em807ResultPending=true;try{save()}catch(e){}}
    return resultBase()
  };
  renderPost=function(){S.em807ResultPending=false;try{save()}catch(e){};return postBase()};
  finishPost=function(){S.em807ResultPending=false;try{save()}catch(e){};return finishPostBase()};
  runNextStop=function(){
    if(!S.live&&S.em807ResultPending&&S.lastMatch)return resultBase();
    return runBase()
  };
  render=function(){
    const r=renderBase();
    if(!S.live&&S.em807ResultPending&&S.lastMatch){setTimeout(()=>{if(!S.live&&S.em807ResultPending&&S.lastMatch)resultBase()},0)}
    return r
  };

  window.em807BuildScenario=(idx=0,l=S.live)=>build807(idx,l);
})();


/* ===== El Míster v0.8.8 · cierre de partido con silbatazo y guardia anti-final prematuro =====
   - Un partido normal no puede finalizar antes de llegar realmente a 90'.
   - Evita dobles cierres disparados por callbacks viejos de decisiones/minijuegos.
   - Al llegar al final se congela el Motor 2D y se muestra un cierre visible antes del resultado.
*/
(function(){
  const finish808Base=finishLiveMatch;
  const regulation808Base=finishRegulation;

  function em808Score(l){
    try{return `${Number(l?.gh)||0} – ${Number(l?.ga)||0}`}catch(e){return '—'}
  }
  function em808CanActuallyEnd(l){
    if(!l)return false;
    if(l.pens)return true;
    const minute=Number(l.minute)||0;
    // En tiempo reglamentario el único cierre válido es desde 90'.
    // En prórroga simulateSegment deja el reloj en 120'.
    return minute>=90;
  }
  function em808ResumeAfterBlockedFinish(l){
    if(!l||S.live!==l)return;
    l.em808Finishing=false;
    try{save()}catch(e){}
    setTimeout(()=>{
      if(S.live===l&&!l.scenario){
        try{runNextStop()}catch(e){console.error('em808 resume after blocked finish',e)}
      }
    },80)
  }

  finishLiveMatch=function(){
    const l=S.live;
    // Si el partido ya fue cerrado, dejamos actuar al protector de resultado de v0.8.7.
    if(!l)return finish808Base();

    // Guardia principal: ningún callback viejo puede mandar al postpartido antes de 90'.
    if(!em808CanActuallyEnd(l)){
      console.warn('em808 blocked premature finish at',l.minute);
      em808ResumeAfterBlockedFinish(l);
      return;
    }

    // Un solo cierre por partido aunque queden callbacks pendientes.
    if(l.em808Finishing)return;
    l.em808Finishing=true;
    try{if(typeof em80Stop==='function')em80Stop()}catch(e){}
    try{save()}catch(e){}

    // En penales/prórroga también se muestra el cierre, pero nunca antes de resolverlos.
    const extra=(Number(l.minute)||0)>90;
    const title=extra?'FINAL TRAS LA PRÓRROGA':'FINAL DEL PARTIDO';
    const text=extra?`Se terminó. Marcador: ${em808Score(l)}.`:`El árbitro marca el final a los ${Number(l.minute)||90}'. Marcador: ${em808Score(l)}.`;

    const complete=()=>{
      if(!S.live||S.live!==l)return;
      try{finish808Base()}catch(e){
        console.error('em808 finish base',e);
        l.em808Finishing=false;
        try{save()}catch(x){}
      }
    };

    // No saltar directamente de la cancha al postpartido: primero hay cierre visible.
    try{
      showConsequence({
        type:'info',icon:'🏁',title,text,effects:['Partido terminado'],duration:1700,onDone:complete
      });
    }catch(e){complete()}
  };

  finishRegulation=function(){
    const l=S.live;
    if(!l)return;
    // Refuerzo por si alguna ruta heredada intenta terminar el encuentro antes de tiempo.
    if((Number(l.minute)||0)<90){
      console.warn('em808 blocked premature regulation at',l.minute);
      return em808ResumeAfterBlockedFinish(l);
    }
    return regulation808Base();
  };

  // Migración segura para partidas que quedaron guardadas durante una transición de pantalla.
  try{
    if(S?.live){
      S.live.em808Finishing=false;
      save();
    }
  }catch(e){console.warn('em808 migration',e)}

  window.em808MatchEndGuard=true;
})();


/* ===== El Míster v0.8.9 · verdad visual de la jugada =====
   Alcance deliberadamente mínimo:
   - NO cambia el Motor 2D, decisiones, minijuegos, goles, reloj ni cierre de partido.
   - Una intervención congela y dibuja el estado REAL que ya tenía el Motor 2D.
   - Se desactiva el viejo "staging" que movía jugadores/pelota para fabricar escenas.
   - Sólo reinicios reales (penal, córner y tiro libre) pueden preparar una colocación específica.
*/
(function(){
  function em809SceneType(sc){
    try{
      return (typeof window.em804SceneType==='function') ? window.em804SceneType(sc) : null;
    }catch(e){
      console.warn('em809 scene type',e);
      return null;
    }
  }

  function em809IsRealRestart(sc){
    if(!sc)return false;
    /* Las decisiones creadas por la lógica de zona ya nacen de la posición real de la pelota. */
    if(sc.em806ZoneKey)return false;
    const type=em809SceneType(sc);
    return type==='penalty'||type==='corner'||type==='freekick';
  }

  function em809DrawDecisionTruth(){
    const l=(typeof S!=='undefined'&&S)?S.live:null;
    const canvas=document.getElementById('em80DecisionCanvas');
    if(!canvas||!l)return;

    const sc=l.scenario;
    if(sc&&em809IsRealRestart(sc)&&typeof window.em804StageScenario==='function'){
      /* Penal/córner/tiro libre sí son una nueva puesta en juego y necesitan su posición reglamentaria. */
      try{window.em804StageScenario(sc,l)}catch(e){console.warn('em809 restart stage',e)}
    }else{
      /* Muy importante: acá NO se tocan x/y, dueño de pelota, trayectorias ni posiciones. */
      l.em804Scene=null;
      l.em804SceneStamp=null;
    }

    if(typeof em80Draw==='function')em80Draw(canvas,l);
  }

  /* v0.8.4 había envuelto esta función y teletransportaba la escena antes de dibujarla.
     Al sobrescribir únicamente este hook, el resto del motor permanece intacto. */
  em80DrawDecision=em809DrawDecisionTruth;

  window.em809AnimationTruth={
    drawDecision:em809DrawDecisionTruth,
    isRealRestart:em809IsRealRestart,
    version:'0.8.9'
  };
})();

</script>
